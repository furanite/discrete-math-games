<style>
/* Layout: one 4:3 game screen floating over the living canvas (grain, brain, network); controls and codex sit outside the screen */
:root{
  --ink:#0c0c0b;--panel:rgba(14,14,12,.72);
  --text:#ece7dc;--text-2:rgba(236,231,220,.7);--text-3:rgba(236,231,220,.42);
  --line:rgba(236,231,220,.16);--line-2:rgba(236,231,220,.34);--good:#a8cfa6;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.grain{position:fixed;inset:-60%;z-index:1;pointer-events:none;opacity:.11;background-repeat:repeat;background-size:220px 220px;animation:grain .8s steps(8) infinite}
@keyframes grain{0%{transform:translate(0,0)}12%{transform:translate(-4%,3%)}25%{transform:translate(3%,-5%)}37%{transform:translate(-6%,-2%)}50%{transform:translate(5%,4%)}62%{transform:translate(-2%,6%)}75%{transform:translate(6%,-3%)}87%{transform:translate(-5%,-6%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 35%,rgba(0,0,0,.6) 100%)}
@media (prefers-reduced-motion:reduce){.grain{animation:none}}
.app{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tb{font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;cursor:pointer}
.tb:hover{border-color:var(--text)}
:focus-visible{outline:1.5px solid var(--text);outline-offset:3px}
.screen{width:min(100%,calc((100vh - 230px) * 4 / 3),960px);min-width:min(100%,320px);aspect-ratio:4/3;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);background:transparent}
#game{width:100%;height:100%;display:block;touch-action:none;image-rendering:auto}
.where{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.pad{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.dpad button,.ab button{font-family:var(--mono);font-size:16px;color:var(--text);background:var(--panel);border:1px solid var(--line-2);border-radius:12px;cursor:pointer;touch-action:none}
.dpad button:active,.ab button:active{background:rgba(236,231,220,.16)}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.ab{display:flex;gap:10px;align-items:center}
.ab button{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ab button small{font-size:9.5px;color:var(--text-3);letter-spacing:.08em}
.credits{width:100%;max-width:960px;justify-content:center;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px 40px}
.credits div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.credits b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.2}
.credits .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.ab .c{width:48px;height:48px}
@media (max-width:420px){.pad{gap:10px}.dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}.ab{gap:8px}.ab button{width:56px;height:56px}.ab .c{width:42px;height:42px}}
@media (max-width:350px){.pad{gap:8px}.dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}.ab{gap:8px}.ab button{width:48px;height:48px}.ab .c{width:36px;height:36px}}
.keys{font-family:var(--mono);font-size:11.5px;color:var(--text-3);text-align:center}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media (hover:none),(pointer:coarse){.keys{display:none}}
dialog#codex{width:min(760px,calc(100% - 32px));max-height:min(86vh,900px);background:#0e0e0c;color:var(--text);border:1px solid var(--line-2);border-radius:14px;padding:0;overflow:hidden}
dialog#codex::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
.cx-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cx-head h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.cx-head span{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.08em}
#codexBody{overflow-y:auto;max-height:calc(min(86vh,900px) - 76px);padding:8px 22px 24px}
.cx-sec h3{font-family:var(--display);font-weight:400;font-size:24px;margin:20px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cx-sec h3 span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.cx-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.cx-item b{display:block;font-weight:600;font-size:15px;margin:2px 0 4px}
.cx-item p{margin:0;color:var(--text-2);font-size:14px}
.cx-tabs{display:flex;gap:6px;width:100%;margin-top:4px}
.cx-tab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--text-2);cursor:pointer}
.cx-tab[aria-selected="true"]{background:var(--text);color:#0e0e0c;border-color:var(--text)}
.gx-tools{position:sticky;top:-8px;background:#0e0e0c;padding:12px 0 10px;z-index:1;display:flex;flex-direction:column;gap:10px}
.gx-q{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--text);font:inherit;font-size:14px}
.gx-q:focus{outline:none;border-color:var(--text)}
.gx-chips{display:flex;flex-wrap:wrap;gap:6px}
.gx-chips button{font-family:var(--mono);font-size:10.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--text-2);cursor:pointer}
.gx-chips button[aria-pressed="true"]{background:var(--text);color:#0e0e0c;border-color:var(--text)}
.cx-item .gx-ex{margin-top:6px;font-size:13px;color:var(--text-3);border-left:1px solid var(--line-2);padding-left:9px}
dialog#codex[open]{display:flex;flex-direction:column}
#codexBody{flex:1;min-height:0;max-height:none!important}
@media (max-width:520px){.cx-head{padding:14px 16px}.cx-head h2{font-size:26px}#codexBody{padding:4px 16px 20px}}
.cx-item.locked{opacity:.45;border-style:dashed}
.cx-kind{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="grain" id="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <div class="brand"><b>The Sleeping Proof</b><span id="where">Title</span></div>
    <div class="tools"><button class="tb" id="codexBtn">Codex <span style="opacity:.5;font-family:var(--mono);font-size:11px">C</span></button><button class="tb" id="muteBtn" aria-pressed="false">Sound on</button></div>
  </header>
  <div class="screen"><canvas id="game" width="640" height="480" aria-label="Game screen. Arrow keys move, Z confirms, X goes back, C opens the codex." tabindex="0"></canvas></div>
  <p class="keys">Arrows or WASD move · Z / Enter talk and confirm · X / Esc back · C codex · M sound</p>
  <section class="credits" aria-label="Credits">
    <div><span class="eyebrow">Author &amp; project manager</span><b>Moinuddeen</b></div>
    <div><span class="eyebrow">Made by</span><b>Claude, an AI model by Anthropic</b></div>
  </section>
  <div class="pad" aria-label="Touch controls">
    <div class="dpad"><button class="u" data-k="up" aria-label="Up">▲</button><button class="l" data-k="left" aria-label="Left">◀</button><button class="r" data-k="right" aria-label="Right">▶</button><button class="d" data-k="down" aria-label="Down">▼</button></div>
    <div class="ab"><button class="c" data-k="c" aria-label="Codex">C<small>CODEX</small></button><button data-k="b" aria-label="Back">X<small>BACK</small></button><button data-k="a" aria-label="Confirm">Z<small>ACT</small></button></div>
  </div>
</div>

<dialog id="codex" aria-labelledby="codexTitle">
  <div class="cx-head"><h2 id="codexTitle">Codex</h2><span id="codexCount"></span><button class="tb" id="codexClose">Close</button>
    <div class="cx-tabs" role="tablist"><button class="cx-tab" role="tab" id="tabFound" aria-selected="true">Found</button><button class="cx-tab" role="tab" id="tabGloss" aria-selected="false">Glossary</button></div></div>
  <div id="codexBody"></div>
</dialog>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const C=(n,k)=>{if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
const fact=n=>n<=1?1:n*fact(n-1);
const frac=(p,q)=>{const g=gcd(p,q);p/=g;q/=g;return q===1?String(p):p+'/'+q};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<span class="m">$1</span>');
function opts(ans,cands){const out=[String(ans)],seen=new Set(out);for(const c of cands){const s=String(c);if(seen.has(s))continue;if(typeof c==='number'&&(!Number.isInteger(c)||c<0))continue;seen.add(s);out.push(s);if(out.length===4)break}let k=1;while(out.length<4&&typeof ans==='number'){const c=ans+(k%2?Math.ceil(k/2):-Math.ceil(k/2));k++;if(c>=0&&!seen.has(String(c))){seen.add(String(c));out.push(String(c))}}return out}

/* ---------- sources ---------- */
const SRC={
  PRIN:{name:'Princeton COS 341',url:'https://www.cs.princeton.edu/courses/archive/fall05/cos341/handouts.html'},
  HARV:{name:'Harvard CS 20',url:'https://lewis.seas.harvard.edu/pages/harvard-computer-science-20-discrete-mathematics-computer-science'},
  CORN:{name:'Cornell CS 2800',url:'https://www.cs.cornell.edu/courses/cs2800/2017sp/'},
  COLU:{name:'Columbia COMS 3203',url:'https://www.cs.columbia.edu/~amoretti/3203/'},
  CAM:{name:'Cambridge Discrete Maths',url:'https://www.cl.cam.ac.uk/teaching/1617/DiscMath/DiscMathProofsNumbersSetsSlides.pdf'},
  UIUC:{name:'Illinois CS 173',url:'https://courses.grainger.illinois.edu/cs173/fa2013/B-lecture/Lectures/'}
};

/* ---------- generated questions ---------- */
function gcdGen(){const g=pick([2,3,4,5,6,7,8,9,12,14,15]);let x,y;do{x=rnd(4,23);y=rnd(3,x-1)}while(gcd(x,y)!==1);const a=g*x,b=g*y;
  return{q:`What is \`gcd(${a}, ${b})\`?`,o:opts(g,[g*2,g*3,x,y,g+2,Math.max(1,g-1)]),w:`Run Euclid's algorithm until the remainder is 0. The last nonzero remainder is ${g}. Indeed ${a} = ${g}·${x} and ${b} = ${g}·${y}, with ${x} and ${y} coprime.`,s:'CAM'}}
function modGen(){const n=rnd(3,13),a=rnd(60,999),r=a%n;return{q:`What is \`${a} mod ${n}\`?`,o:opts(r,[(r+1)%n,(r+n-1)%n,(r+2)%n,n-r]),w:`Division with remainder: ${a} = ${n} · ${Math.floor(a/n)} + ${r}, and 0 ≤ ${r} < ${n}.`,s:'CORN'}}
function invGen(){const p=pick([7,11,13,17]),a=rnd(2,p-1);let inv=1;while((a*inv)%p!==1)inv++;const others=shuffle([...Array(p-1)].map((_,i)=>i+1).filter(v=>v!==inv));
  return{q:`What is the multiplicative inverse of ${a} modulo ${p}?`,o:opts(inv,others),w:`${a} · ${inv} = ${a*inv} ≡ 1 (mod ${p}). Since ${p} is prime, every nonzero residue has an inverse.`,s:'CORN'}}
function chooseGen(){const n=rnd(6,12),k=rnd(2,4),ans=C(n,k);return{q:`How many ways can you choose a committee of ${k} from ${n} people?`,o:opts(ans,[C(n,k)*fact(k),n*k,C(n,k-1),C(n+1,k)]),w:`Order does not matter, so it is C(${n}, ${k}) = ${n}! / (${k}! · ${n-k}!) = ${ans}.`,s:'HARV'}}
function diceGen(){const s=rnd(2,12),ways=6-Math.abs(s-7),ans=frac(ways,36);const c=[];for(let t=2;t<=12;t++)c.push(frac(6-Math.abs(t-7),36));c.push(frac(s,36),'1/6','1/12','1/11');
  return{q:`Roll two fair dice. What is the probability that the sum is ${s}?`,o:opts(ans,shuffle(c)),w:`${ways} of the 36 equally likely outcomes sum to ${s}, so the probability is ${ways}/36 = ${ans}.`,s:'CORN'}}

/* ---------- fresh questions: every topic builds new ones each run ---------- */
const M=s=>'`'+s+'`';
function sopts(ans,cands){const out=[String(ans)],seen=new Set(out);for(const c of cands){const s=String(c);if(!seen.has(s)){seen.add(s);out.push(s)}if(out.length===4)break}return out}
const setStr=a=>a.length?'{'+[...a].sort((x,y)=>x-y).join(', ')+'}':'∅';
const subN=n=>String(n).replace(/\d/g,c=>'₀₁₂₃₄₅₆₇₈₉'[c]);
const pctStr=x=>(Math.round(x*1000)/10)+'%';

/* logic */
function lgRowsGen(){const V=['p','q','r'],L=[a=>a,a=>'¬'+a];
  const atom=()=>{const v=pick(V);return Math.random()<.3?{s:'¬'+v,f:e=>!e[v]}:{s:v,f:e=>e[v]}};
  const ops=[['∧',(a,b)=>a&&b],['∨',(a,b)=>a||b],['→',(a,b)=>!a||b],['↔',(a,b)=>a===b],['⊕',(a,b)=>a!==b]];
  const bin=(x,y)=>{const[o,f]=pick(ops);return{s:x.s+' '+o+' '+y.s,f:e=>f(x.f(e),y.f(e))}};
  const par=x=>({s:'('+x.s+')',f:x.f});
  let F,cnt;do{F=Math.random()<.5?bin(par(bin(atom(),atom())),atom()):bin(atom(),par(bin(atom(),atom())));
    cnt=0;for(let r=0;r<8;r++){const e={p:!!(r&4),q:!!(r&2),r:!!(r&1)};if(F.f(e))cnt++}}while(new Set(F.s.match(/[pqr]/g)).size<3);
  return{q:`In how many of the 8 rows of its truth table is ${M(F.s)} true?`,o:opts(cnt,[8-cnt,cnt+1,cnt-1,4,2,6]),w:`Evaluate the formula in each of the 2³ = 8 rows (p, q, r each T or F). It comes out true in ${cnt} of them${cnt===8?', so it is a tautology':cnt===0?', so it is a contradiction':''}.`,s:'UIUC'}}
function lgNegGen(){const P=pick(['P(x, y)','L(x, y)','R(x, y)']),Q=pick(['Q(x, y)','S(x, y)']).replace(P[0],'T');
  const q1=pick(['∀','∃']),q2=pick(['∀','∃']),fl=c=>c==='∀'?'∃':'∀';
  const inner=pick([['→',`${P} → ${Q}`,`${P} ∧ ¬${Q}`,`¬${P} → ¬${Q}`],['∧',`${P} ∧ ${Q}`,`¬${P} ∨ ¬${Q}`,`¬${P} ∧ ¬${Q}`],['∨',`${P} ∨ ${Q}`,`¬${P} ∧ ¬${Q}`,`¬${P} ∨ ¬${Q}`]]);
  const pre=`${q1}x ${q2}y`,npre=`${fl(q1)}x ${fl(q2)}y`;
  return{q:`Which statement is the negation of ${M(pre+' ('+inner[1]+')')}?`,o:sopts(M(npre+' ('+inner[2]+')'),[M(npre+' ('+inner[3]+')'),M(pre+' ('+inner[2]+')'),M(`${fl(q1)}x ${q2}y (${inner[2]})`),M(pre+' ('+inner[3]+')')]),
    w:`Flip every quantifier (${pre} becomes ${npre}) and negate the inside. ${inner[0]==='→'?'¬(A → B) ≡ A ∧ ¬B':inner[0]==='∧'?'¬(A ∧ B) ≡ ¬A ∨ ¬B':'¬(A ∨ B) ≡ ¬A ∧ ¬B'}.`,s:'CORN'}}
const IMPL=[['n is divisible by 6','n is even','n is odd','n is not divisible by 6'],['a shape is a square','it has four sides','it does not have four sides','it is not a square'],['it is raining','the ground is wet','the ground is not wet','it is not raining'],['n² is odd','n is odd','n is even','n² is even'],['a graph is a tree','it has no cycles','it has a cycle','it is not a tree'],['x > 5','x > 2','x ≤ 2','x ≤ 5'],['f is a bijection','f has an inverse','f has no inverse','f is not a bijection']];
function lgFormGen(){const[p,q,nq,np]=pick(IMPL),k=pick(['contrapositive','converse','inverse']);
  const forms={contrapositive:`If ${nq}, then ${np}.`,converse:`If ${q}, then ${p}.`,inverse:`If ${np}, then ${nq}.`,negation:`“${p}” is true and “${q}” is false.`};
  return{q:`Statement: “If ${p}, then ${q}.” Which is its ${k}?`,o:sopts(forms[k],Object.keys(forms).filter(x=>x!==k).map(x=>forms[x])),w:`For P → Q: the converse is Q → P, the inverse ¬P → ¬Q, the contrapositive ¬Q → ¬P. Only the contrapositive always has the same truth value as the original.`,s:'UIUC'}}

/* proofs */
const isPrime=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true};
function pfCounterGen(){if(Math.random()<.5){const a=rnd(5,60)*2+1;const odd=[];for(let n=a;n<a+40;n+=2)odd.push(n);const comp=odd.filter(n=>!isPrime(n)),pr=shuffle(odd.filter(isPrime));
    const c=pick(comp);return{q:`Which number is a counterexample to “every odd number from ${a} to ${a+38} is prime”?`,o:sopts(c,pr),w:`${c} is odd and in range, but ${c} = ${(()=>{for(let d=3;;d+=2)if(c%d===0)return d+' · '+c/d})()}. The other options are primes, so they agree with the claim.`,s:'PRIN'}}
  const [a,b]=pick([[4,6],[6,10],[6,9],[4,10],[10,15],[6,15],[12,8]]);const l=a*b/gcd(a,b),ab=a*b;
  const good=n=>n%a===0&&n%b===0&&n%ab!==0;const c=l*pick([1,1,3].filter(k=>good(l*k)));const cand=shuffle([ab,2*ab,a*rnd(2,7),b*rnd(2,7),a+b,ab+a].filter(n=>!good(n)));
  return{q:`Which number is a counterexample to “if n is divisible by ${a} and by ${b}, then n is divisible by ${ab}”?`,o:sopts(c,cand),w:`${c} is divisible by ${a} and by ${b}, but not by ${ab}. The claim fails because ${a} and ${b} share the factor ${gcd(a,b)}; it is true when the two numbers are coprime.`,s:'UIUC'}}
function pfPigeonGen(){const t=rnd(0,2);
  if(t===0){const[k,who,how,box]=pick([[7,'people','were born on the same day of the week','days of the week'],[12,'people','share a birth month','months'],[26,'words','start with the same letter','letters'],[10,'phone numbers','end in the same digit','possible last digits'],[4,'cards','have the same suit','suits']]),m=rnd(2,4),N=(m-1)*k+1;

function inRecGen(){if(Math.random()<.5){const a0=rnd(0,3),r=rnd(2,3),d=rnd(1,4),k=rnd(4,6);let a=a0;const seq=[a];for(let i=1;i<=k;i++){a=r*a+d;seq.push(a)}

  if(t===2){const n=rnd(6,30),c=rnd(1,4),a=n-c;return{q:c===1?`A tree has ${n} vertices. How many edges does it have?`:`A forest (a graph with no cycles) has ${n} vertices and ${c} connected components. How many edges?`,o:opts(a,[n,n+1,n-1===a?n-2:n-1,2*n-2]),w:c===1?`A tree on n vertices has n − 1 = ${a} edges.`:`Each component is a tree with (its vertices − 1) edges, so the total is n − c = ${n} − ${c} = ${a}.`,s:'UIUC'}}

const graphical=d=>{d=d.slice();for(;;){d.sort((a,b)=>b-a);const k=d.shift();if(k===undefined||k===0)return d.every(x=>x===0);if(k>d.length)return false;for(let i=0;i<k;i++){d[i]--;if(d[i]<0)return false}}};
function degGen(){let d;const bad=Math.random()<.25;do{const n=rnd(5,8);d=[...Array(n)].map(()=>rnd(1,5)).sort((a,b)=>b-a)}while(d[0]>=d.length||(bad?d.reduce((a,b)=>a+b)%2===0:!(graphical(d)&&d.reduce((a,b)=>a+b)/2>=d.length-1)));

  return{q:`A connected graph has degree sequence (${d.join(', ')}). What does it have?`,o:sopts(ans,['An Euler circuit','An Euler path, but no Euler circuit','Neither','It depends on how the edges are drawn'].filter(x=>x!==ans)),w:`${odd} vertices have odd degree. Connected with 0 odd vertices: Euler circuit. Exactly 2: Euler path only. More: neither. (Its ${E} edges follow from handshaking. Degrees alone never settle Hamiltonicity.)`,s:'CORN'}}

/* ---------- briefings: what each layer teaches before you play ---------- */
const LESSONS={
logic:{intro:'Logic is the grammar of every proof. You need to read a formula, know exactly when it is true, and transform it without changing its meaning.',ideas:[
 {t:'Connectives have exact truth conditions',b:'`¬p` flips p. `p ∧ q` needs both. `p ∨ q` needs at least one. `p → q` is false only when p is T and q is F. `p ↔ q` is true when the two sides agree.',ex:'“If it rains, the ground is wet” is not broken on a dry sunny day: a false premise makes `p → q` true.'},
 {t:'Equivalences let you rewrite',b:'De Morgan: `¬(p ∧ q) ≡ ¬p ∨ ¬q` and `¬(p ∨ q) ≡ ¬p ∧ ¬q`. Implication: `p → q ≡ ¬p ∨ q ≡ ¬q → ¬p` (the contrapositive). The converse `q → p` is NOT equivalent.',ex:'`¬(p → q) ≡ ¬(¬p ∨ q) ≡ p ∧ ¬q`. To refute an implication, find a case where the premise holds and the conclusion fails.'},
 {t:'Quantifiers and their negations',b:'`∀x P(x)` claims every x works; `∃x P(x)` claims at least one does. Negating flips the quantifier: `¬∀x P(x) ≡ ∃x ¬P(x)`. Order matters: `∀x ∃y` lets y depend on x; `∃y ∀x` demands one y for all.',ex:'`∀x ∃y (y > x)` is true on ℤ (take y = x + 1). `∃y ∀x (y > x)` says a largest-plus-one integer exists, which is false.'},
 {t:'Rules of inference',b:'Modus ponens: from p and `p → q`, get q. Modus tollens: from `¬q` and `p → q`, get `¬p`. Soundness means proofs only reach true conclusions; completeness means every valid formula has a proof.',ex:'“If n is divisible by 4 then n is even.” 6 is even, yet 6 is not divisible by 4. Inferring p from q is the fallacy called affirming the consequent.'}],
 trap:'Affirming the consequent: knowing `p → q` and q tells you nothing about p.'},
proofs:{intro:'A proof is a chain of justified steps from what you know to what you claim. Picking the right strategy is most of the work.',ideas:[
 {t:'Direct proof',b:'To prove `P → Q`, assume P and derive Q using definitions. Unfold definitions first: “even” means n = 2k for some integer k.',ex:'If m and n are even, m = 2a and n = 2b, so m + n = 2(a + b) is even.'},
 {t:'Contrapositive',b:'Prove `¬Q → ¬P` instead. Useful when Q is hard to use but ¬Q gives you something concrete.',ex:'“If n² is even then n is even.” Contrapositive: if n = 2k + 1 then n² = 4k² + 4k + 1 = 2(2k² + 2k) + 1 is odd.'},
 {t:'Contradiction',b:'Assume the statement is false and derive an impossibility. Classic targets: irrationality, infinitude, non-existence.',ex:'√2 = a/b in lowest terms forces a and b both even, which contradicts lowest terms.'},
 {t:'Cases, counterexamples, pigeonhole',b:'Split into exhaustive cases (even/odd, sign). One counterexample kills a universal claim. Pigeonhole: n + 1 objects in n boxes puts two in one box.',ex:'Among any 5 integers, two have the same remainder mod 4: 5 numbers, 4 possible remainders.'}],
 trap:'Checking examples is never a proof of a universal claim, but one counterexample is a complete disproof.'},
sets:{intro:'Sets are the raw material of mathematics: collections defined only by what belongs to them.',ideas:[
 {t:'Membership vs subset',b:'`x ∈ A` says x is an element. `A ⊆ B` says every element of A is in B. Two sets are equal exactly when each is a subset of the other (extensionality).',ex:'For S = {1, {1}}: 1 ∈ S, {1} ∈ S, and {1} ⊆ S. But {{1}} ⊆ S too, while 2 ∉ S.'},
 {t:'Operations and laws',b:'Union `∪`, intersection `∩`, difference `∖`, complement `ᶜ`, symmetric difference `△`. De Morgan for sets: `(A ∪ B)ᶜ = Aᶜ ∩ Bᶜ`. Intersection distributes over union and vice versa.',ex:'To prove A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C), take x on the left: x ∈ A and (x ∈ B or x ∈ C). In each case x is on the right.'},
 {t:'Products and power sets',b:'`A × B` is all ordered pairs, size |A|·|B|. `P(A)` is all subsets, size 2^|A|.',ex:'P({a, b}) = {∅, {a}, {b}, {a, b}}: four subsets.'},
 {t:'Sizes of infinity',b:'A set is countable if it can be listed: ℕ, ℤ, ℚ. Cantor’s diagonal argument shows ℝ and P(ℕ) cannot be listed. Russell’s paradox shows not every description defines a set.',ex:'List ℤ as 0, 1, −1, 2, −2, … so ℤ is countable, even though it looks “twice as big” as ℕ.'}],
 trap:'∅ ⊆ A is always true; ∅ ∈ A is usually false.'},
func:{intro:'Functions and relations describe how elements connect. Their properties decide what can be inverted, counted, or grouped.',ideas:[
 {t:'Injective, surjective, bijective',b:'Injective: different inputs give different outputs. Surjective: every element of the codomain is hit. Bijective: both, so an inverse exists.',ex:'f(x) = 2x on ℤ is injective (2a = 2b ⇒ a = b) but misses 3, so not surjective. On ℝ it is bijective.'},
 {t:'Composition',b:'If `g ∘ f` is injective then f is injective; if `g ∘ f` is surjective then g is surjective. Compositions of bijections are bijections.',ex:'f: {1} → {a, b}, g collapses both to one point. g ∘ f is injective yet g is not.'},
 {t:'Relation properties',b:'Reflexive: every (a, a). Symmetric: (a, b) gives (b, a). Antisymmetric: (a, b) and (b, a) only when a = b. Transitive: (a, b) and (b, c) give (a, c).',ex:'Divides on ℕ: reflexive, antisymmetric, transitive. So it is a partial order, not an equivalence.'},
 {t:'Equivalence relations partition',b:'Reflexive + symmetric + transitive splits the set into disjoint classes. Each class contains exactly the elements equivalent to one another.',ex:'Congruence mod 3 gives three classes: …, −3, 0, 3, … and …, −2, 1, 4, … and …, −1, 2, 5, …'}],
 trap:'Symmetric and antisymmetric are not opposites: equality is both, and some relations are neither.'},
ind:{intro:'Induction proves infinitely many statements with two finite checks. It is how you reason about anything defined step by step.',ideas:[
 {t:'The template',b:'1) State P(n). 2) Base case: prove P(n₀). 3) Inductive step: assume P(k) for an arbitrary k ≥ n₀ and prove P(k + 1). 4) Conclude ∀n ≥ n₀ P(n).',ex:'2ⁿ ≥ n + 1. Base: 2⁰ = 1 ≥ 1. Step: 2^(k+1) = 2·2ᵏ ≥ 2(k + 1) ≥ k + 2.'},
 {t:'Use the hypothesis',b:'The step must actually use P(k). Write the k + 1 case so the k case appears inside it.',ex:'1 + ⋯ + (k + 1) = [1 + ⋯ + k] + (k + 1), and the bracket is k(k + 1)/2 by hypothesis.'},
 {t:'Strong induction',b:'Assume P(n₀), …, P(k) all hold. Needed when the k + 1 case reduces to cases much smaller than k.',ex:'Any amount ≥ 12 cents can be paid with 4s and 5s: check 12, 13, 14, 15, then n = (n − 4) + 4.'},
 {t:'Structural induction and recursion',b:'For recursively defined objects (trees, strings, formulas): prove the property for base objects and show each constructor preserves it.',ex:'A full binary tree is a leaf or a root with two full subtrees. Leaves = internal + 1 holds for a leaf (1 = 0 + 1) and is preserved when joining two trees.'}],
 trap:'The base case is not optional: “n = n + 1 implies n + 1 = n + 2” is a valid step for a false claim.'},
num:{intro:'Number theory studies the integers through divisibility. It is the mathematics behind cryptography on the web.',ideas:[
 {t:'Division and gcd',b:'For b > 0, a = qb + r with 0 ≤ r < b. Euclid: gcd(a, b) = gcd(b, a mod b), repeated until the remainder is 0.',ex:'gcd(252, 105): 252 = 2·105 + 42, 105 = 2·42 + 21, 42 = 2·21 + 0, so the gcd is 21.'},
 {t:'Bézout and inverses',b:'gcd(a, b) = ax + by for some integers x, y (extended Euclid). So a has an inverse mod n exactly when gcd(a, n) = 1.',ex:'21 = 105 − 2·42 = 105 − 2(252 − 2·105) = 5·105 − 2·252.'},
 {t:'Modular arithmetic',b:'a ≡ b (mod n) means n | (a − b). You can add and multiply, reducing at every step. Division needs an inverse.',ex:'7¹⁰ mod 6: 7 ≡ 1, so 7¹⁰ ≡ 1¹⁰ = 1.'},
 {t:'Fermat, Euler, RSA',b:'Fermat: p prime, p ∤ a ⇒ `aᵖ⁻¹ ≡ 1 (mod p)`. Euler: `a^φ(n) ≡ 1` when gcd(a, n) = 1. RSA publishes n = pq and e; decrypting needs d with ed ≡ 1 mod φ(n), which needs the factors.',ex:'2¹⁰⁰ mod 11: 2¹⁰ ≡ 1, so 2¹⁰⁰ = (2¹⁰)¹⁰ ≡ 1.'}],
 trap:'You cannot cancel freely mod n: 2·3 ≡ 2·0 (mod 6) but 3 ≢ 0.'},
count:{intro:'Counting turns “how many?” into structure: decide whether order matters and whether repeats are allowed, then pick the matching formula.',ideas:[
 {t:'Product and sum rules',b:'Independent stages multiply; disjoint alternatives add. Sequences of length k from n symbols: nᵏ.',ex:'License plates with 3 letters then 3 digits: 26³ · 10³.'},
 {t:'Permutations and combinations',b:'Ordered, no repeats: n!/(n − k)!. Unordered, no repeats: C(n, k) = n!/(k!(n − k)!). Repeated letters: divide by the factorial of each repeat.',ex:'Arrangements of MISSISSIPPI: 11!/(4!·4!·2!) = 34650.'},
 {t:'Stars and bars',b:'Choosing k items from n kinds with repetition, or k identical balls into n boxes: C(n + k − 1, k).',ex:'Solutions to x + y + z = 10 in nonnegative integers: C(12, 2) = 66.'},
 {t:'Inclusion–exclusion and pigeonhole',b:'|A ∪ B| = |A| + |B| − |A ∩ B|, alternating for more sets. Pigeonhole: n items in k boxes puts at least ⌈n/k⌉ in some box.',ex:'Derangements of n: n! Σ (−1)ⁱ/i!. For n = 4 that is 24 − 24 + 12 − 4 + 1 = 9.'}],
 trap:'Ask “does order matter?” before every count. Committees: no. Passwords: yes.'},
prob:{intro:'Discrete probability is counting with weights. Expectation and a few inequalities answer most questions you will meet.',ideas:[
 {t:'Sample spaces',b:'With equally likely outcomes, P(E) = |E|/|Ω|. P(Eᶜ) = 1 − P(E) is often the easier route.',ex:'P(at least one 6 in 4 rolls) = 1 − (5/6)⁴ ≈ 0.518.'},
 {t:'Conditioning and independence',b:'P(A | B) = P(A ∩ B)/P(B). Bayes flips the condition. Independent means P(A ∩ B) = P(A)P(B).',ex:'A test is 99% accurate for a 1-in-1000 disease. A positive result means only about 9% chance of disease: the false positives dominate.'},
 {t:'Expectation is linear',b:'E[X + Y] = E[X] + E[Y] always, independent or not. Write a count as a sum of indicator variables.',ex:'Expected fixed points of a random permutation: n indicators, each with probability 1/n, total 1.'},
 {t:'Variance and tail bounds',b:'Var(X) = E[X²] − E[X]². Markov: P(X ≥ a) ≤ E[X]/a for X ≥ 0. Chebyshev: P(|X − μ| ≥ kσ) ≤ 1/k².',ex:'If average quiz time is 10 minutes, at most 1/3 of students take 30 minutes or more (Markov).'}],
 trap:'Disjoint is not independent. Two disjoint events with positive probability are always dependent.'},
graph:{intro:'Graphs model networks: vertices joined by edges. A handful of theorems answers questions about routes, colourings and matchings.',ideas:[
 {t:'Degrees',b:'Handshaking: Σ deg(v) = 2|E|. So every graph has an even number of odd-degree vertices.',ex:'Can 7 people each shake hands with exactly 3 others? 7·3 = 21 is odd, so no.'},
 {t:'Walks that cover everything',b:'Euler circuit (every edge once): connected and every degree even. Hamiltonian cycle (every vertex once): no simple test is known; it is NP-complete.',ex:'The Königsberg bridges have four odd-degree land masses, so no walk crosses each bridge exactly once.'},
 {t:'Trees and colouring',b:'A tree on n vertices has n − 1 edges and a unique path between any two vertices. χ(G) is the fewest colours with no edge monochromatic. Bipartite ⇔ χ ≤ 2 ⇔ no odd cycle.',ex:'Exam scheduling: courses are vertices, shared students are edges, colours are time slots.'},
 {t:'Planarity, matchings, paths',b:'Planar connected graphs satisfy V − E + F = 2, hence E ≤ 3V − 6. Hall: X can be matched iff every S ⊆ X has |N(S)| ≥ |S|. Dijkstra finds shortest paths with nonnegative weights.',ex:'K₅ has V = 5, E = 10 > 3·5 − 6 = 9, so it is not planar.'}],
 trap:'Euler is about edges, Hamilton about vertices. The easy test only exists for Euler.'}
};

/* ---------- glossary: every term and principle, by category ---------- */
const GLOSSARY={
logic:[
 {t:'Proposition',d:'A statement that is either true or false, never both.',ex:'“7 is prime” (true); “2 + 2 = 5” (false). “Close the door” is not a proposition.'},
 {t:'Negation ¬p',d:'True exactly when p is false.'},
 {t:'Conjunction p ∧ q',d:'True only when both p and q are true.'},
 {t:'Disjunction p ∨ q',d:'True when at least one of p, q is true (inclusive or).'},
 {t:'Exclusive or p ⊕ q',d:'True when exactly one of p, q is true; the negation of p ↔ q.'},
 {t:'Implication p → q',d:'False only when p is true and q is false. Equivalent to ¬p ∨ q. p is the hypothesis, q the conclusion.',ex:'A false hypothesis makes the implication (vacuously) true.'},
 {t:'Converse, inverse, contrapositive',d:'For p → q: converse q → p; inverse ¬p → ¬q; contrapositive ¬q → ¬p. Only the contrapositive is equivalent to the original.'},
 {t:'Biconditional p ↔ q',d:'True when p and q have the same truth value; equivalent to (p → q) ∧ (q → p).'},
 {t:'Truth table',d:'Lists a formula’s value for every assignment of its variables; n variables give 2ⁿ rows.'},
 {t:'Tautology, contradiction, contingency',d:'Always true; always false; sometimes true and sometimes false.',ex:'p ∨ ¬p is a tautology; p ∧ ¬p is a contradiction.'},
 {t:'Satisfiable',d:'True under at least one assignment of truth values.'},
 {t:'Logical equivalence A ≡ B',d:'A and B have the same truth value in every row; equivalently A ↔ B is a tautology.'},
 {t:'De Morgan’s laws',d:'¬(p ∧ q) ≡ ¬p ∨ ¬q and ¬(p ∨ q) ≡ ¬p ∧ ¬q.'},
 {t:'Distributive laws',d:'p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r) and p ∨ (q ∧ r) ≡ (p ∨ q) ∧ (p ∨ r).'},
 {t:'Predicate',d:'A statement with variables, such as P(x): “x > 3”, which becomes a proposition once the variables are fixed or quantified.'},
 {t:'Universal quantifier ∀',d:'∀x P(x): P holds for every x in the domain. Proved with an arbitrary element; refuted by one counterexample.'},
 {t:'Existential quantifier ∃',d:'∃x P(x): P holds for at least one x in the domain. Proved by exhibiting a witness.'},
 {t:'Quantifier negation',d:'¬∀x P(x) ≡ ∃x ¬P(x) and ¬∃x P(x) ≡ ∀x ¬P(x).'},
 {t:'Order of quantifiers',d:'∀x ∃y lets y depend on x; ∃y ∀x needs one y that works for all x. Swapping them can change the truth value.'},
 {t:'Domain of discourse',d:'The set the variables range over. The same formula can be true over ℝ and false over ℚ.',ex:'∃x (x² = 2)'},
 {t:'Vacuous truth',d:'A universal statement about an empty collection is true, because no element can fail it.'},
 {t:'Modus ponens',d:'From p and p → q, conclude q.'},
 {t:'Modus tollens',d:'From ¬q and p → q, conclude ¬p.'},
 {t:'Affirming the consequent (fallacy)',d:'Concluding p from p → q and q. Invalid: q may be true for other reasons.'},
 {t:'Soundness and completeness',d:'Sound: every provable formula is valid. Complete: every valid formula is provable. Propositional and first-order logic have proof systems that are both.'}
],
proofs:[
 {t:'Theorem, lemma, corollary',d:'A theorem is a proved statement; a lemma is a helper result; a corollary follows quickly from a theorem.'},
 {t:'Conjecture',d:'A statement believed true but not yet proved.',ex:'Goldbach’s conjecture.'},
 {t:'Axiom',d:'A statement accepted without proof as a starting point.'},
 {t:'Direct proof',d:'Assume the hypothesis, use definitions and known results, reach the conclusion.'},
 {t:'Proof by contraposition',d:'Prove p → q by proving ¬q → ¬p directly.'},
 {t:'Proof by contradiction',d:'Assume the statement is false and derive an impossibility, so the statement must be true.',ex:'√2 is irrational; there are infinitely many primes.'},
 {t:'Proof by cases',d:'Split into exhaustive cases and prove the claim in each.'},
 {t:'Without loss of generality (WLOG)',d:'Handle one of several symmetric cases, because the others follow by the same argument.'},
 {t:'Counterexample',d:'One instance where a universal claim fails; it fully disproves the claim.'},
 {t:'Existence proof',d:'Shows something exists. Constructive proofs exhibit it; non-constructive proofs show it must exist without naming it.'},
 {t:'Uniqueness proof',d:'Show existence, then show any two objects with the property are equal.'},
 {t:'If and only if (iff)',d:'Prove both directions: p → q and q → p.'},
 {t:'Pigeonhole principle',d:'Putting n + 1 objects into n boxes puts at least two in one box. Generalized: N objects in k boxes put at least ⌈N/k⌉ in some box.'},
 {t:'Even, odd, divides',d:'n is even if n = 2k, odd if n = 2k + 1, and a | b if b = ak, for some integer k.'},
 {t:'Rational and irrational',d:'A rational number is p/q with integers p, q and q ≠ 0; anything real that is not rational is irrational.'},
 {t:'Evidence is not proof',d:'Checking many cases never proves a universal claim.',ex:'Pólya’s conjecture first fails at 906,150,257.'}
],
sets:[
 {t:'Set',d:'An unordered collection of distinct objects, its elements.'},
 {t:'Element x ∈ A',d:'x is a member of A; x ∉ A means it is not.'},
 {t:'Set-builder notation',d:'{x | P(x)}: all x satisfying P.'},
 {t:'Empty set ∅',d:'The set with no elements. It is a subset of every set.'},
 {t:'Subset A ⊆ B',d:'Every element of A is in B. A proper subset A ⊊ B also misses something in B.'},
 {t:'Set equality',d:'A = B exactly when A ⊆ B and B ⊆ A (extensionality).'},
 {t:'Cardinality |A|',d:'The number of elements of A, or for infinite sets, its size measured by bijections.'},
 {t:'Union, intersection',d:'A ∪ B: in A or B. A ∩ B: in both.'},
 {t:'Difference, complement',d:'A ∖ B: in A but not B. Aᶜ: in the universe U but not in A.'},
 {t:'Symmetric difference A △ B',d:'Elements in exactly one of A and B: (A ∖ B) ∪ (B ∖ A).'},
 {t:'Disjoint',d:'A ∩ B = ∅.'},
 {t:'Power set P(A)',d:'The set of all subsets of A; |P(A)| = 2^|A|.'},
 {t:'Cartesian product A × B',d:'All ordered pairs (a, b) with a ∈ A, b ∈ B; |A × B| = |A|·|B|.'},
 {t:'Partition',d:'A collection of nonempty, pairwise disjoint subsets whose union is the whole set.'},
 {t:'Set identities',d:'De Morgan: (A ∪ B)ᶜ = Aᶜ ∩ Bᶜ. Distributive: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C).'},
 {t:'Countable',d:'Finite, or in bijection with ℕ (it can be listed). ℤ and ℚ are countable.'},
 {t:'Uncountable',d:'Infinite but not countable. ℝ and P(ℕ) are uncountable.'},
 {t:'Cantor’s diagonal argument',d:'Any list of infinite sequences misses the sequence that differs from the n-th entry in the n-th place.'},
 {t:'Cantor’s theorem',d:'|P(A)| > |A| for every set A, so there is no largest infinity.'},
 {t:'Russell’s paradox',d:'The “set” {x | x ∉ x} contains itself iff it does not. Axiomatic set theory forbids such unrestricted definitions.'}
],
func:[
 {t:'Function f : A → B',d:'Assigns each element of the domain A exactly one element of the codomain B.'},
 {t:'Image and range',d:'f(x) is the image of x; the range f(A) is the set of all images.'},
 {t:'Preimage f⁻¹(S)',d:'All inputs whose image lies in S. Defined for every function.'},
 {t:'Injective (one-to-one)',d:'f(a) = f(b) implies a = b.'},
 {t:'Surjective (onto)',d:'Every element of the codomain is the image of some input.'},
 {t:'Bijective',d:'Both injective and surjective; exactly the functions with a two-sided inverse.'},
 {t:'Composition g ∘ f',d:'(g ∘ f)(x) = g(f(x)). If g ∘ f is injective, f is; if g ∘ f is surjective, g is.'},
 {t:'Inverse function f⁻¹',d:'Undoes f: f⁻¹(f(x)) = x and f(f⁻¹(y)) = y. Exists exactly when f is bijective.'},
 {t:'Counting functions',d:'From an m-set to an n-set: nᵐ functions, n!/(n − m)! injective ones.'},
 {t:'Relation',d:'A subset R of A × B; for a relation on A, a subset of A × A.'},
 {t:'Reflexive',d:'(a, a) ∈ R for every a.'},
 {t:'Symmetric',d:'(a, b) ∈ R implies (b, a) ∈ R.'},
 {t:'Antisymmetric',d:'(a, b) and (b, a) in R imply a = b.'},
 {t:'Transitive',d:'(a, b) and (b, c) in R imply (a, c) ∈ R.'},
 {t:'Equivalence relation',d:'Reflexive, symmetric and transitive.',ex:'Congruence mod n.'},
 {t:'Equivalence class [a]',d:'All elements related to a. The classes partition the set.'},

ind:[

 {t:'Base case',d:'The first case P(n₀), checked directly.'},
 {t:'Inductive hypothesis',d:'The assumption that P(k) holds for an arbitrary k ≥ n₀.'},
 {t:'Inductive step',d:'Using the hypothesis to prove P(k + 1).'},
 {t:'Strong induction',d:'Assume P(n₀), …, P(k) all hold and prove P(k + 1). Equivalent in power to ordinary induction.',ex:'Every n ≥ 2 is a product of primes.'},
 {t:'Well-ordering principle',d:'Every nonempty set of natural numbers has a least element; equivalent to induction.'},
 {t:'Recursive definition',d:'Defines objects from base cases and rules that build new ones from old.',ex:'F₀ = 0, F₁ = 1, Fₙ = Fₙ₋₁ + Fₙ₋₂.'},
 {t:'Structural induction',d:'Prove a property for the base objects of a recursive definition and show each construction rule preserves it.'},
 {t:'Recurrence relation',d:'An equation defining a sequence from earlier terms, such as aₙ = 2aₙ₋₁ + 1.'},
 {t:'Closed form',d:'A direct formula for the n-th term, often found by guessing and proved by induction.',ex:'aₙ = 2ⁿ − 1 solves aₙ = 2aₙ₋₁ + 1, a₀ = 0.'},
 {t:'Sum of the first n integers',d:'1 + 2 + ⋯ + n = n(n + 1)/2.'},
 {t:'Sum of the first n odd numbers',d:'1 + 3 + ⋯ + (2n − 1) = n².'},
 {t:'Geometric series',d:'1 + r + ⋯ + rⁿ = (rⁿ⁺¹ − 1)/(r − 1) for r ≠ 1.'},
 {t:'Full binary tree',d:'Every internal node has exactly two children; it has one more leaf than internal nodes.'},
 {t:'Faulty induction',d:'A step that fails for some k (like n = 1 → 2 in the “all horses are one colour” proof) breaks the whole chain.'}
],

 {t:'Prime and composite',d:'A prime has exactly two positive divisors, 1 and itself. A composite n > 1 is not prime.'},
 {t:'Fundamental Theorem of Arithmetic',d:'Every integer n > 1 is a product of primes, uniquely up to order.'},
 {t:'Infinitely many primes',d:'Euclid: for any finite list of primes, p₁⋯pₙ + 1 has a prime factor not on the list.'},
 {t:'gcd and lcm',d:'gcd(a, b) is the largest common divisor; lcm(a, b) the smallest positive common multiple; gcd·lcm = ab for positive a, b.'},

 {t:'Modular inverse',d:'a⁻¹ mod n satisfies a·a⁻¹ ≡ 1; it exists exactly when gcd(a, n) = 1.'},
 {t:'Euler’s totient φ(n)',d:'The number of integers in 1..n coprime to n. φ(p) = p − 1 for prime p; φ(pq) = (p − 1)(q − 1).'},
 {t:'Fermat’s little theorem',d:'If p is prime and p ∤ a, then aᵖ⁻¹ ≡ 1 (mod p).'},

 {t:'RSA',d:'Public key (n = pq, e); private d with ed ≡ 1 (mod φ(n)). Encrypt c = mᵉ mod n, decrypt m = cᵈ mod n. Security rests on factoring being hard.'},

],
count:[

 {t:'Permutation',d:'An ordered arrangement. n! arrangements of n objects; P(n, k) = n!/(n − k)! ordered selections of k.'},

 {t:'Words with repeated letters',d:'n!/(n₁!n₂!⋯) where nᵢ are the repeat counts.',ex:'BANANA: 6!/(3!·2!) = 60.'},
 {t:'Stars and bars',d:'Choosing k items from n kinds with repetition, or k identical balls into n boxes: C(n + k − 1, k).'},
 {t:'Binomial theorem',d:'(x + y)ⁿ = Σₖ C(n, k) xᵏ yⁿ⁻ᵏ.'},
 {t:'Pascal’s rule',d:'C(n, k) = C(n − 1, k − 1) + C(n − 1, k).'},
 {t:'Symmetry',d:'C(n, k) = C(n, n − k).'},
 {t:'Row sum',d:'Σₖ C(n, k) = 2ⁿ, the number of subsets of an n-set.'},
 {t:'Combinatorial proof',d:'Prove an identity by counting the same set in two ways.'},
 {t:'Inclusion–exclusion',d:'|A ∪ B| = |A| + |B| − |A ∩ B|; for more sets, alternate adding and subtracting intersections.'},
 {t:'Derangement',d:'A permutation with no fixed points. Dₙ = n! Σ (−1)ⁱ/i!; D₄ = 9.'},
 {t:'Pigeonhole principle',d:'N objects in k boxes force some box to hold at least ⌈N/k⌉.'},

],

 {t:'Event',d:'A subset of the sample space.'},
 {t:'Uniform probability',d:'With equally likely outcomes, P(E) = |E|/|Ω|.'},
 {t:'Complement rule',d:'P(Eᶜ) = 1 − P(E).'},
 {t:'Union rule',d:'P(A ∪ B) = P(A) + P(B) − P(A ∩ B).'},
 {t:'Conditional probability',d:'P(A | B) = P(A ∩ B)/P(B): the probability of A once B is known to have happened.'},
 {t:'Independence',d:'P(A ∩ B) = P(A)P(B). Disjoint events with positive probability are not independent.'},
 {t:'Law of total probability',d:'P(A) = Σ P(A | Bᵢ)P(Bᵢ) over a partition B₁, B₂, …'},
 {t:'Bayes’ rule',d:'P(A | B) = P(B | A)P(A)/P(B). Base rates matter.'},

 {t:'Expected value E[X]',d:'Σ x·P(X = x): the long-run average.'},
 {t:'Linearity of expectation',d:'E[X + Y] = E[X] + E[Y] and E[cX] = cE[X], with no independence needed.'},
 {t:'Indicator variable',d:'1 if an event happens, else 0; its expectation is the event’s probability.'},
 {t:'Variance',d:'Var(X) = E[(X − μ)²] = E[X²] − E[X]². Standard deviation σ = √Var(X).'},
 {t:'Bernoulli and binomial',d:'Bernoulli(p): one trial. Binomial(n, p): successes in n independent trials; P(k) = C(n, k)pᵏ(1 − p)ⁿ⁻ᵏ, mean np.'},
 {t:'Geometric distribution',d:'Trials until the first success; mean 1/p.'},
 {t:'Markov’s inequality',d:'For X ≥ 0 and a > 0, P(X ≥ a) ≤ E[X]/a.'},
 {t:'Chebyshev’s inequality',d:'P(|X − μ| ≥ kσ) ≤ 1/k².'},
 {t:'Law of large numbers',d:'The average of many independent trials approaches the expected value.'},
 {t:'Gambler’s fallacy',d:'Believing independent trials “even out”. A fair coin has no memory.'}
],

 {t:'Connected',d:'Every two vertices are joined by a path.'},
 {t:'Complete graph Kₙ',d:'Every pair of n vertices is adjacent; it has C(n, 2) edges.'},

 {t:'Isomorphism',d:'A bijection between vertex sets that preserves adjacency.'},
 {t:'Euler circuit and path',d:'Use every edge exactly once. A connected graph has an Euler circuit iff every degree is even, and an Euler path iff 0 or 2 vertices have odd degree.'},
 {t:'Hamiltonian cycle',d:'Visits every vertex exactly once. Deciding whether one exists is NP-complete.'},

 {t:'Colouring and χ(G)',d:'Colour vertices so adjacent ones differ; χ(G) is the fewest colours. Greedy uses at most Δ + 1.'},
 {t:'Planar graph',d:'Can be drawn without crossing edges. Connected planar graphs satisfy V − E + F = 2, hence E ≤ 3V − 6 for V ≥ 3.'},
 {t:'Kuratowski’s theorem',d:'A graph is planar iff it contains no subdivision of K₅ or K₃,₃.'},
 {t:'Four Colour Theorem',d:'Every planar graph can be coloured with 4 colours.'},
 {t:'Matching',d:'A set of edges with no shared endpoints.'},

]};

 ents:[
  {t:'npc',x:4,y:5,sym:'g',name:'Glia',lines:['Glia: Oh! A signal! You’re awake. I’m Glia. I hold this place together while she sleeps.','Glia: She is Professor Elin Mar. She spent her whole life proving things.','Glia: Then one night she stopped. The mind went quiet, and other things moved in.','Glia: Fallacies. Each one guards a region of her reasoning. They aren’t evil. They are what is left when understanding goes missing.','Glia: You can’t fight them. A thought can’t punch a misconception. But you can REASON with them until they see clearly. Then you can show MERCY.','Glia: Arrow keys or WASD to move. Z or Enter to talk and confirm. X to go back. C opens your Codex, where everything you learn is kept.','Glia: On a phone, use the pad and buttons under the screen.','Glia: Practice on Echo, over there by the door. Echo only repeats things, but Echo is kind.'],
