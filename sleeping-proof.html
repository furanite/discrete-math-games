<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const C=(n,k)=>{if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
const fact=n=>n<=1?1:n*fact(n-1);
const frac=(p,q)=>{const g=gcd(p,q);p/=g;q/=g;return q===1?String(p):p+'/'+q};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<span class="m">$1</span>');
function opts(ans,cands){const out=[String(ans)],seen=new Set(out);for(const c of cands){const s=String(c);if(seen.has(s))continue;if(typeof c==='number'&&(!Number.isInteger(c)||c<0))continue;seen.add(s);out.push(s);if(out.length===4)break}let k=1;while(out.length<4&&typeof ans==='number'){const c=ans+(k%2?Math.ceil(k/2):-Math.ceil(k/2));k++;if(c>=0&&!seen.has(String(c))){seen.add(String(c));out.push(String(c))}}return out}

/* ---------- sources ---------- */
const SRC={
  PRIN:{name:'Princeton COS 341',url:'https://www.cs.princeton.edu/courses/archive/fall05/cos341/handouts.html'},
  HARV:{name:'Harvard CS 20',url:'https://lewis.seas.harvard.edu/pages/harvard-computer-science-20-discrete-mathematics-computer-science'},
  CORN:{name:'Cornell CS 2800',url:'https://www.cs.cornell.edu/courses/cs2800/2017sp/'},
  COLU:{name:'Columbia COMS 3203',url:'https://www.cs.columbia.edu/~amoretti/3203/'},
  CAM:{name:'Cambridge Discrete Maths',url:'https://www.cl.cam.ac.uk/teaching/1617/DiscMath/DiscMathProofsNumbersSetsSlides.pdf'},
  UIUC:{name:'Illinois CS 173',url:'https://courses.grainger.illinois.edu/cs173/fa2013/B-lecture/Lectures/'}
};

/* ---------- generated questions ---------- */
function gcdGen(){const g=pick([2,3,4,5,6,7,8,9,12,14,15]);let x,y;do{x=rnd(4,23);y=rnd(3,x-1)}while(gcd(x,y)!==1);const a=g*x,b=g*y;
  return{q:`What is \`gcd(${a}, ${b})\`?`,o:opts(g,[g*2,g*3,x,y,g+2,Math.max(1,g-1)]),w:`Run Euclid's algorithm until the remainder is 0. The last nonzero remainder is ${g}. Indeed ${a} = ${g}·${x} and ${b} = ${g}·${y}, with ${x} and ${y} coprime.`,s:'CAM'}}
function modGen(){const n=rnd(3,13),a=rnd(60,999),r=a%n;return{q:`What is \`${a} mod ${n}\`?`,o:opts(r,[(r+1)%n,(r+n-1)%n,(r+2)%n,n-r]),w:`Division with remainder: ${a} = ${n} · ${Math.floor(a/n)} + ${r}, and 0 ≤ ${r} < ${n}.`,s:'CORN'}}
function invGen(){const p=pick([7,11,13,17]),a=rnd(2,p-1);let inv=1;while((a*inv)%p!==1)inv++;const others=shuffle([...Array(p-1)].map((_,i)=>i+1).filter(v=>v!==inv));
  return{q:`What is the multiplicative inverse of ${a} modulo ${p}?`,o:opts(inv,others),w:`${a} · ${inv} = ${a*inv} ≡ 1 (mod ${p}). Since ${p} is prime, every nonzero residue has an inverse.`,s:'CORN'}}
function chooseGen(){const n=rnd(6,12),k=rnd(2,4),ans=C(n,k);return{q:`How many ways can you choose a committee of ${k} from ${n} people?`,o:opts(ans,[C(n,k)*fact(k),n*k,C(n,k-1),C(n+1,k)]),w:`Order does not matter, so it is C(${n}, ${k}) = ${n}! / (${k}! · ${n-k}!) = ${ans}.`,s:'HARV'}}
function diceGen(){const s=rnd(2,12),ways=6-Math.abs(s-7),ans=frac(ways,36);const c=[];for(let t=2;t<=12;t++)c.push(frac(6-Math.abs(t-7),36));c.push(frac(s,36),'1/6','1/12','1/11');
  return{q:`Roll two fair dice. What is the probability that the sum is ${s}?`,o:opts(ans,shuffle(c)),w:`${ways} of the 36 equally likely outcomes sum to ${s}, so the probability is ${ways}/36 = ${ans}.`,s:'CORN'}}

/* ---------- fresh questions: every topic builds new ones each run ---------- */
const M=s=>'`'+s+'`';
function sopts(ans,cands){const out=[String(ans)],seen=new Set(out);for(const c of cands){const s=String(c);if(!seen.has(s)){seen.add(s);out.push(s)}if(out.length===4)break}return out}
const setStr=a=>a.length?'{'+[...a].sort((x,y)=>x-y).join(', ')+'}':'∅';
const subN=n=>String(n).replace(/\d/g,c=>'₀₁₂₃₄₅₆₇₈₉'[c]);
const pctStr=x=>(Math.round(x*1000)/10)+'%';

/* logic */
function lgRowsGen(){const V=['p','q','r'],L=[a=>a,a=>'¬'+a];
  const atom=()=>{const v=pick(V);return Math.random()<.3?{s:'¬'+v,f:e=>!e[v]}:{s:v,f:e=>e[v]}};
  const ops=[['∧',(a,b)=>a&&b],['∨',(a,b)=>a||b],['→',(a,b)=>!a||b],['↔',(a,b)=>a===b],['⊕',(a,b)=>a!==b]];
  const bin=(x,y)=>{const[o,f]=pick(ops);return{s:x.s+' '+o+' '+y.s,f:e=>f(x.f(e),y.f(e))}};
  const par=x=>({s:'('+x.s+')',f:x.f});
  let F,cnt;do{F=Math.random()<.5?bin(par(bin(atom(),atom())),atom()):bin(atom(),par(bin(atom(),atom())));
    cnt=0;for(let r=0;r<8;r++){const e={p:!!(r&4),q:!!(r&2),r:!!(r&1)};if(F.f(e))cnt++}}while(new Set(F.s.match(/[pqr]/g)).size<3);
  return{q:`In how many of the 8 rows of its truth table is ${M(F.s)} true?`,o:opts(cnt,[8-cnt,cnt+1,cnt-1,4,2,6]),w:`Evaluate the formula in each of the 2³ = 8 rows (p, q, r each T or F). It comes out true in ${cnt} of them${cnt===8?', so it is a tautology':cnt===0?', so it is a contradiction':''}.`,s:'UIUC'}}
function lgNegGen(){const P=pick(['P(x, y)','L(x, y)','R(x, y)']),Q=pick(['Q(x, y)','S(x, y)']).replace(P[0],'T');
  const q1=pick(['∀','∃']),q2=pick(['∀','∃']),fl=c=>c==='∀'?'∃':'∀';
  const inner=pick([['→',`${P} → ${Q}`,`${P} ∧ ¬${Q}`,`¬${P} → ¬${Q}`],['∧',`${P} ∧ ${Q}`,`¬${P} ∨ ¬${Q}`,`¬${P} ∧ ¬${Q}`],['∨',`${P} ∨ ${Q}`,`¬${P} ∧ ¬${Q}`,`¬${P} ∨ ¬${Q}`]]);
  const pre=`${q1}x ${q2}y`,npre=`${fl(q1)}x ${fl(q2)}y`;
  return{q:`Which statement is the negation of ${M(pre+' ('+inner[1]+')')}?`,o:sopts(M(npre+' ('+inner[2]+')'),[M(npre+' ('+inner[3]+')'),M(pre+' ('+inner[2]+')'),M(`${fl(q1)}x ${q2}y (${inner[2]})`),M(pre+' ('+inner[3]+')')]),
    w:`Flip every quantifier (${pre} becomes ${npre}) and negate the inside. ${inner[0]==='→'?'¬(A → B) ≡ A ∧ ¬B':inner[0]==='∧'?'¬(A ∧ B) ≡ ¬A ∨ ¬B':'¬(A ∨ B) ≡ ¬A ∧ ¬B'}.`,s:'CORN'}}
const IMPL=[['n is divisible by 6','n is even','n is odd','n is not divisible by 6'],['a shape is a square','it has four sides','it does not have four sides','it is not a square'],['it is raining','the ground is wet','the ground is not wet','it is not raining'],['n² is odd','n is odd','n is even','n² is even'],['a graph is a tree','it has no cycles','it has a cycle','it is not a tree'],['x > 5','x > 2','x ≤ 2','x ≤ 5'],['f is a bijection','f has an inverse','f has no inverse','f is not a bijection']];
function lgFormGen(){const[p,q,nq,np]=pick(IMPL),k=pick(['contrapositive','converse','inverse']);
  const forms={contrapositive:`If ${nq}, then ${np}.`,converse:`If ${q}, then ${p}.`,inverse:`If ${np}, then ${nq}.`,negation:`“${p}” is true and “${q}” is false.`};
  return{q:`Statement: “If ${p}, then ${q}.” Which is its ${k}?`,o:sopts(forms[k],Object.keys(forms).filter(x=>x!==k).map(x=>forms[x])),w:`For P → Q: the converse is Q → P, the inverse ¬P → ¬Q, the contrapositive ¬Q → ¬P. Only the contrapositive always has the same truth value as the original.`,s:'UIUC'}}

/* proofs */
const isPrime=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true};
function pfCounterGen(){if(Math.random()<.5){const a=rnd(5,60)*2+1;const odd=[];for(let n=a;n<a+40;n+=2)odd.push(n);const comp=odd.filter(n=>!isPrime(n)),pr=shuffle(odd.filter(isPrime));
    const c=pick(comp);return{q:`Which number is a counterexample to “every odd number from ${a} to ${a+38} is prime”?`,o:sopts(c,pr),w:`${c} is odd and in range, but ${c} = ${(()=>{for(let d=3;;d+=2)if(c%d===0)return d+' · '+c/d})()}. The other options are primes, so they agree with the claim.`,s:'PRIN'}}
  const [a,b]=pick([[4,6],[6,10],[6,9],[4,10],[10,15],[6,15],[12,8]]);const l=a*b/gcd(a,b),ab=a*b;
  const good=n=>n%a===0&&n%b===0&&n%ab!==0;const c=l*pick([1,1,3].filter(k=>good(l*k)));const cand=shuffle([ab,2*ab,a*rnd(2,7),b*rnd(2,7),a+b,ab+a].filter(n=>!good(n)));
  return{q:`Which number is a counterexample to “if n is divisible by ${a} and by ${b}, then n is divisible by ${ab}”?`,o:sopts(c,cand),w:`${c} is divisible by ${a} and by ${b}, but not by ${ab}. The claim fails because ${a} and ${b} share the factor ${gcd(a,b)}; it is true when the two numbers are coprime.`,s:'UIUC'}}
function pfPigeonGen(){const t=rnd(0,2);
  if(t===0){const[k,who,how,box]=pick([[7,'people','were born on the same day of the week','days of the week'],[12,'people','share a birth month','months'],[26,'words','start with the same letter','letters'],[10,'phone numbers','end in the same digit','possible last digits'],[4,'cards','have the same suit','suits']]),m=rnd(2,4),N=(m-1)*k+1;
    return{q:`How many ${who} must you pick to guarantee that at least ${m} of them ${how}?`,o:opts(N,[N-1,m*k,m*k+1,N+k]),w:`Generalized pigeonhole: there are ${k} ${box}, so ${k} boxes; ${(m-1)*k} objects can sit ${m-1} per box. One more, ${N}, forces some box to hold ${m}.`,s:'PRIN'}}
  const N=rnd(20,120),k=rnd(3,11),a=Math.ceil(N/k);

 {q:'Simplify `x + x′y`.',o:['`x + y`','`x`','`y`','`x′y`'],w:'Distribute: (x + x′)(x + y) = 1·(x + y) = x + y.',s:'COLU'},
 {q:'What is the dual of the law `x(y + z) = xy + xz`?',o:['`x + yz = (x + y)(x + z)`','`x + yz = xy + xz`','`x′(y′ + z′) = x′y′ + x′z′`','`(x + y)z = xz + yz`'],w:'Duality swaps + with · (and 0 with 1). It turns one distributive law into the other, which has no counterpart in ordinary arithmetic.',s:'COLU'},
 {q:'Which expression writes `x ⊕ y` as a sum of minterms?',o:['`x′y + xy′`','`xy + x′y′`','`x + y`','`(x + y)(xy)`'],w:'XOR is 1 on rows 01 and 10, which are the minterms x′y and xy′. The second option is XNOR.',s:'COLU'},

/* ---------- briefings: what each layer teaches before you play ---------- */
const LESSONS={
logic:{intro:'Logic is the grammar of every proof. You need to read a formula, know exactly when it is true, and transform it without changing its meaning.',ideas:[
 {t:'Connectives have exact truth conditions',b:'`¬p` flips p. `p ∧ q` needs both. `p ∨ q` needs at least one. `p → q` is false only when p is T and q is F. `p ↔ q` is true when the two sides agree.',ex:'“If it rains, the ground is wet” is not broken on a dry sunny day: a false premise makes `p → q` true.'},
 {t:'Equivalences let you rewrite',b:'De Morgan: `¬(p ∧ q) ≡ ¬p ∨ ¬q` and `¬(p ∨ q) ≡ ¬p ∧ ¬q`. Implication: `p → q ≡ ¬p ∨ q ≡ ¬q → ¬p` (the contrapositive). The converse `q → p` is NOT equivalent.',ex:'`¬(p → q) ≡ ¬(¬p ∨ q) ≡ p ∧ ¬q`. To refute an implication, find a case where the premise holds and the conclusion fails.'},
 {t:'Quantifiers and their negations',b:'`∀x P(x)` claims every x works; `∃x P(x)` claims at least one does. Negating flips the quantifier: `¬∀x P(x) ≡ ∃x ¬P(x)`. Order matters: `∀x ∃y` lets y depend on x; `∃y ∀x` demands one y for all.',ex:'`∀x ∃y (y > x)` is true on ℤ (take y = x + 1). `∃y ∀x (y > x)` says a largest-plus-one integer exists, which is false.'},
 {t:'Rules of inference',b:'Modus ponens: from p and `p → q`, get q. Modus tollens: from `¬q` and `p → q`, get `¬p`. Soundness means proofs only reach true conclusions; completeness means every valid formula has a proof.',ex:'“If n is divisible by 4 then n is even.” 6 is even, yet 6 is not divisible by 4. Inferring p from q is the fallacy called affirming the consequent.'}],
 trap:'Affirming the consequent: knowing `p → q` and q tells you nothing about p.'},
proofs:{intro:'A proof is a chain of justified steps from what you know to what you claim. Picking the right strategy is most of the work.',ideas:[
 {t:'Direct proof',b:'To prove `P → Q`, assume P and derive Q using definitions. Unfold definitions first: “even” means n = 2k for some integer k.',ex:'If m and n are even, m = 2a and n = 2b, so m + n = 2(a + b) is even.'},
 {t:'Contrapositive',b:'Prove `¬Q → ¬P` instead. Useful when Q is hard to use but ¬Q gives you something concrete.',ex:'“If n² is even then n is even.” Contrapositive: if n = 2k + 1 then n² = 4k² + 4k + 1 = 2(2k² + 2k) + 1 is odd.'},
 {t:'Contradiction',b:'Assume the statement is false and derive an impossibility. Classic targets: irrationality, infinitude, non-existence.',ex:'√2 = a/b in lowest terms forces a and b both even, which contradicts lowest terms.'},
 {t:'Cases, counterexamples, pigeonhole',b:'Split into exhaustive cases (even/odd, sign). One counterexample kills a universal claim. Pigeonhole: n + 1 objects in n boxes puts two in one box.',ex:'Among any 5 integers, two have the same remainder mod 4: 5 numbers, 4 possible remainders.'}],
 trap:'Checking examples is never a proof of a universal claim, but one counterexample is a complete disproof.'},
sets:{intro:'Sets are the raw material of mathematics: collections defined only by what belongs to them.',ideas:[
 {t:'Membership vs subset',b:'`x ∈ A` says x is an element. `A ⊆ B` says every element of A is in B. Two sets are equal exactly when each is a subset of the other (extensionality).',ex:'For S = {1, {1}}: 1 ∈ S, {1} ∈ S, and {1} ⊆ S. But {{1}} ⊆ S too, while 2 ∉ S.'},
 {t:'Operations and laws',b:'Union `∪`, intersection `∩`, difference `∖`, complement `ᶜ`, symmetric difference `△`. De Morgan for sets: `(A ∪ B)ᶜ = Aᶜ ∩ Bᶜ`. Intersection distributes over union and vice versa.',ex:'To prove A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C), take x on the left: x ∈ A and (x ∈ B or x ∈ C). In each case x is on the right.'},
 {t:'Products and power sets',b:'`A × B` is all ordered pairs, size |A|·|B|. `P(A)` is all subsets, size 2^|A|.',ex:'P({a, b}) = {∅, {a}, {b}, {a, b}}: four subsets.'},
 {t:'Sizes of infinity',b:'A set is countable if it can be listed: ℕ, ℤ, ℚ. Cantor’s diagonal argument shows ℝ and P(ℕ) cannot be listed. Russell’s paradox shows not every description defines a set.',ex:'List ℤ as 0, 1, −1, 2, −2, … so ℤ is countable, even though it looks “twice as big” as ℕ.'}],
 trap:'∅ ⊆ A is always true; ∅ ∈ A is usually false.'},
func:{intro:'Functions and relations describe how elements connect. Their properties decide what can be inverted, counted, or grouped.',ideas:[
 {t:'Injective, surjective, bijective',b:'Injective: different inputs give different outputs. Surjective: every element of the codomain is hit. Bijective: both, so an inverse exists.',ex:'f(x) = 2x on ℤ is injective (2a = 2b ⇒ a = b) but misses 3, so not surjective. On ℝ it is bijective.'},
 {t:'Composition',b:'If `g ∘ f` is injective then f is injective; if `g ∘ f` is surjective then g is surjective. Compositions of bijections are bijections.',ex:'f: {1} → {a, b}, g collapses both to one point. g ∘ f is injective yet g is not.'},
 {t:'Relation properties',b:'Reflexive: every (a, a). Symmetric: (a, b) gives (b, a). Antisymmetric: (a, b) and (b, a) only when a = b. Transitive: (a, b) and (b, c) give (a, c).',ex:'Divides on ℕ: reflexive, antisymmetric, transitive. So it is a partial order, not an equivalence.'},
 {t:'Equivalence relations partition',b:'Reflexive + symmetric + transitive splits the set into disjoint classes. Each class contains exactly the elements equivalent to one another.',ex:'Congruence mod 3 gives three classes: …, −3, 0, 3, … and …, −2, 1, 4, … and …, −1, 2, 5, …'}],
 trap:'Symmetric and antisymmetric are not opposites: equality is both, and some relations are neither.'},
ind:{intro:'Induction proves infinitely many statements with two finite checks. It is how you reason about anything defined step by step.',ideas:[
 {t:'The template',b:'1) State P(n). 2) Base case: prove P(n₀). 3) Inductive step: assume P(k) for an arbitrary k ≥ n₀ and prove P(k + 1). 4) Conclude ∀n ≥ n₀ P(n).',ex:'2ⁿ ≥ n + 1. Base: 2⁰ = 1 ≥ 1. Step: 2^(k+1) = 2·2ᵏ ≥ 2(k + 1) ≥ k + 2.'},
 {t:'Use the hypothesis',b:'The step must actually use P(k). Write the k + 1 case so the k case appears inside it.',ex:'1 + ⋯ + (k + 1) = [1 + ⋯ + k] + (k + 1), and the bracket is k(k + 1)/2 by hypothesis.'},
 {t:'Strong induction',b:'Assume P(n₀), …, P(k) all hold. Needed when the k + 1 case reduces to cases much smaller than k.',ex:'Any amount ≥ 12 cents can be paid with 4s and 5s: check 12, 13, 14, 15, then n = (n − 4) + 4.'},
 {t:'Structural induction and recursion',b:'For recursively defined objects (trees, strings, formulas): prove the property for base objects and show each constructor preserves it.',ex:'A full binary tree is a leaf or a root with two full subtrees. Leaves = internal + 1 holds for a leaf (1 = 0 + 1) and is preserved when joining two trees.'}],
 trap:'The base case is not optional: “n = n + 1 implies n + 1 = n + 2” is a valid step for a false claim.'},
num:{intro:'Number theory studies the integers through divisibility. It is the mathematics behind cryptography on the web.',ideas:[
 {t:'Division and gcd',b:'For b > 0, a = qb + r with 0 ≤ r < b. Euclid: gcd(a, b) = gcd(b, a mod b), repeated until the remainder is 0.',ex:'gcd(252, 105): 252 = 2·105 + 42, 105 = 2·42 + 21, 42 = 2·21 + 0, so the gcd is 21.'},
 {t:'Bézout and inverses',b:'gcd(a, b) = ax + by for some integers x, y (extended Euclid). So a has an inverse mod n exactly when gcd(a, n) = 1.',ex:'21 = 105 − 2·42 = 105 − 2(252 − 2·105) = 5·105 − 2·252.'},
 {t:'Modular arithmetic',b:'a ≡ b (mod n) means n | (a − b). You can add and multiply, reducing at every step. Division needs an inverse.',ex:'7¹⁰ mod 6: 7 ≡ 1, so 7¹⁰ ≡ 1¹⁰ = 1.'},
 {t:'Fermat, Euler, RSA',b:'Fermat: p prime, p ∤ a ⇒ `aᵖ⁻¹ ≡ 1 (mod p)`. Euler: `a^φ(n) ≡ 1` when gcd(a, n) = 1. RSA publishes n = pq and e; decrypting needs d with ed ≡ 1 mod φ(n), which needs the factors.',ex:'2¹⁰⁰ mod 11: 2¹⁰ ≡ 1, so 2¹⁰⁰ = (2¹⁰)¹⁰ ≡ 1.'}],
 trap:'You cannot cancel freely mod n: 2·3 ≡ 2·0 (mod 6) but 3 ≢ 0.'},
count:{intro:'Counting turns “how many?” into structure: decide whether order matters and whether repeats are allowed, then pick the matching formula.',ideas:[
 {t:'Product and sum rules',b:'Independent stages multiply; disjoint alternatives add. Sequences of length k from n symbols: nᵏ.',ex:'License plates with 3 letters then 3 digits: 26³ · 10³.'},
 {t:'Permutations and combinations',b:'Ordered, no repeats: n!/(n − k)!. Unordered, no repeats: C(n, k) = n!/(k!(n − k)!). Repeated letters: divide by the factorial of each repeat.',ex:'Arrangements of MISSISSIPPI: 11!/(4!·4!·2!) = 34650.'},
 {t:'Stars and bars',b:'Choosing k items from n kinds with repetition, or k identical balls into n boxes: C(n + k − 1, k).',ex:'Solutions to x + y + z = 10 in nonnegative integers: C(12, 2) = 66.'},
 {t:'Inclusion–exclusion and pigeonhole',b:'|A ∪ B| = |A| + |B| − |A ∩ B|, alternating for more sets. Pigeonhole: n items in k boxes puts at least ⌈n/k⌉ in some box.',ex:'Derangements of n: n! Σ (−1)ⁱ/i!. For n = 4 that is 24 − 24 + 12 − 4 + 1 = 9.'}],
 trap:'Ask “does order matter?” before every count. Committees: no. Passwords: yes.'},
prob:{intro:'Discrete probability is counting with weights. Expectation and a few inequalities answer most questions you will meet.',ideas:[
 {t:'Sample spaces',b:'With equally likely outcomes, P(E) = |E|/|Ω|. P(Eᶜ) = 1 − P(E) is often the easier route.',ex:'P(at least one 6 in 4 rolls) = 1 − (5/6)⁴ ≈ 0.518.'},
 {t:'Conditioning and independence',b:'P(A | B) = P(A ∩ B)/P(B). Bayes flips the condition. Independent means P(A ∩ B) = P(A)P(B).',ex:'A test is 99% accurate for a 1-in-1000 disease. A positive result means only about 9% chance of disease: the false positives dominate.'},
 {t:'Expectation is linear',b:'E[X + Y] = E[X] + E[Y] always, independent or not. Write a count as a sum of indicator variables.',ex:'Expected fixed points of a random permutation: n indicators, each with probability 1/n, total 1.'},
 {t:'Variance and tail bounds',b:'Var(X) = E[X²] − E[X]². Markov: P(X ≥ a) ≤ E[X]/a for X ≥ 0. Chebyshev: P(|X − μ| ≥ kσ) ≤ 1/k².',ex:'If average quiz time is 10 minutes, at most 1/3 of students take 30 minutes or more (Markov).'}],
 trap:'Disjoint is not independent. Two disjoint events with positive probability are always dependent.'},
graph:{intro:'Graphs model networks: vertices joined by edges. A handful of theorems answers questions about routes, colourings and matchings.',ideas:[
 {t:'Degrees',b:'Handshaking: Σ deg(v) = 2|E|. So every graph has an even number of odd-degree vertices.',ex:'Can 7 people each shake hands with exactly 3 others? 7·3 = 21 is odd, so no.'},
 {t:'Walks that cover everything',b:'Euler circuit (every edge once): connected and every degree even. Hamiltonian cycle (every vertex once): no simple test is known; it is NP-complete.',ex:'The Königsberg bridges have four odd-degree land masses, so no walk crosses each bridge exactly once.'},
 {t:'Trees and colouring',b:'A tree on n vertices has n − 1 edges and a unique path between any two vertices. χ(G) is the fewest colours with no edge monochromatic. Bipartite ⇔ χ ≤ 2 ⇔ no odd cycle.',ex:'Exam scheduling: courses are vertices, shared students are edges, colours are time slots.'},
 {t:'Planarity, matchings, paths',b:'Planar connected graphs satisfy V − E + F = 2, hence E ≤ 3V − 6. Hall: X can be matched iff every S ⊆ X has |N(S)| ≥ |S|. Dijkstra finds shortest paths with nonnegative weights.',ex:'K₅ has V = 5, E = 10 > 3·5 − 6 = 9, so it is not planar.'}],
 trap:'Euler is about edges, Hamilton about vertices. The easy test only exists for Euler.'},
rec:{intro:'A recurrence defines each term from earlier ones. Solving it means finding a closed form, so you can jump straight to the millionth term or read off how fast an algorithm grows.',ideas:[
 {t:'Unroll, guess, then prove',b:'Write out the first few terms, spot the pattern, then prove it by induction. Unrolling `aₙ = aₙ₋₁ + d` gives `aₙ = a₀ + nd`. Unrolling `aₙ = r·aₙ₋₁` gives `aₙ = a₀·rⁿ`.',ex:'Tower of Hanoi: T(n) = 2T(n − 1) + 1, T(1) = 1 gives 1, 3, 7, 15, … Guess T(n) = 2ⁿ − 1 and check: 2(2ⁿ⁻¹ − 1) + 1 = 2ⁿ − 1.'},
 {t:'The characteristic equation',b:'For `aₙ = c₁aₙ₋₁ + c₂aₙ₋₂`, try `aₙ = rⁿ`. That gives `r² = c₁r + c₂`. Distinct roots: `aₙ = A·r₁ⁿ + B·r₂ⁿ`. A repeated root r: `aₙ = (A + Bn)·rⁿ`. The initial values fix A and B.',ex:'aₙ = 5aₙ₋₁ − 6aₙ₋₂ with a₀ = 1, a₁ = 4. The roots of r² − 5r + 6 are 2 and 3. A + B = 1 and 2A + 3B = 4 give A = −1, B = 2, so aₙ = 2·3ⁿ − 2ⁿ.'},
 {t:'Non-homogeneous terms',b:'For `aₙ = c·aₙ₋₁ + d`, add a particular solution to the homogeneous one. If c ≠ 1, try a constant p: p = cp + d. If c = 1, the solution is linear: `aₙ = a₀ + dn`.',ex:'aₙ = 3aₙ₋₁ + 4: p = 3p + 4 gives p = −2, so aₙ = A·3ⁿ − 2. With a₀ = 0 we get A = 2 and aₙ = 2·3ⁿ − 2.'},
 {t:'Divide and conquer, and generating functions',b:'Master theorem for `T(n) = aT(n/b) + Θ(nᵈ)`: if a < bᵈ it is Θ(nᵈ); if a = bᵈ it is Θ(nᵈ log n); if a > bᵈ it is Θ(n^(log_b a)). A generating function packs a sequence into a power series, such as `1/(1 − x) = 1 + x + x² + ⋯`.',ex:'Merge sort: T(n) = 2T(n/2) + n has a = 2 = bᵈ, so Θ(n log n). Karatsuba: T(n) = 3T(n/2) + n has 3 > 2, so Θ(n^(log₂ 3)) ≈ Θ(n^1.58).'}],
 trap:'Watch the indexing and the initial values. An order-2 recurrence needs two starting values, and a₀ is the first term, not a₁.'},
bool:{intro:'Boolean algebra is logic written as algebra on 0 and 1. Every digital circuit, from a light switch to a processor, is designed and simplified with it.',ideas:[
 {t:'Operations and notation',b:'On {0, 1}: `x + y` is OR, `xy` is AND, and `x′` (also written x̄) is the complement. It is logic with 1 for true and 0 for false. Note that `1 + 1 = 1`.',ex:'For x = 1, y = 0, z = 1: `xy + z′` = 1·0 + 0 = 0, while `(x + y)z` = 1·1 = 1.'},
 {t:'Laws for simplifying',b:'Identity `x + 0 = x`, `x·1 = x`. Idempotent `x + x = x`. Complement `x + x′ = 1`, `xx′ = 0`. Absorption `x + xy = x`. De Morgan `(xy)′ = x′ + y′`, `(x + y)′ = x′y′`. Both distributive laws hold, including `x + yz = (x + y)(x + z)`. Every law has a dual: swap + with · and 0 with 1.',ex:'`x + x′y = (x + x′)(x + y) = 1·(x + y) = x + y`.'},
 {t:'Normal forms',b:'Every Boolean function is a sum of minterms: one product per row where it is 1, using every variable once, complemented where the row has 0. The dual form is a product of maxterms. With n variables there are 2ⁿ rows and `2^(2ⁿ)` functions.',ex:'XOR is 1 on rows 01 and 10, so `x ⊕ y = x′y + xy′`. There are 2^(2²) = 16 Boolean functions of two variables.'},
 {t:'Gates, circuits and Karnaugh maps',b:'Gates compute AND, OR, NOT and XOR. NAND and NOR are each functionally complete on their own. A Karnaugh map lists rows in Gray-code order (00, 01, 11, 10) so neighbours differ in one variable. Grouping adjacent 1s in blocks of 1, 2, 4 or 8 removes variables.',ex:'Half adder: sum = `x ⊕ y`, carry = `xy`. On a K-map, `xyz + xyz′` is a block of two that merges into `xy`.'}],
 trap:'Boolean algebra is not ordinary algebra. `x + x = x`, not 2x, and `x + yz = (x + y)(x + z)` is true even though it looks wrong.'}
};

/* ---------- glossary: every term and principle, by category ---------- */
const GLOSSARY={
logic:[
 {t:'Proposition',d:'A statement that is either true or false, never both.',ex:'“7 is prime” (true); “2 + 2 = 5” (false). “Close the door” is not a proposition.'},
 {t:'Negation ¬p',d:'True exactly when p is false.'},
 {t:'Conjunction p ∧ q',d:'True only when both p and q are true.'},
 {t:'Disjunction p ∨ q',d:'True when at least one of p, q is true (inclusive or).'},
 {t:'Exclusive or p ⊕ q',d:'True when exactly one of p, q is true; the negation of p ↔ q.'},
 {t:'Implication p → q',d:'False only when p is true and q is false. Equivalent to ¬p ∨ q. p is the hypothesis, q the conclusion.',ex:'A false hypothesis makes the implication (vacuously) true.'},
 {t:'Converse, inverse, contrapositive',d:'For p → q: converse q → p; inverse ¬p → ¬q; contrapositive ¬q → ¬p. Only the contrapositive is equivalent to the original.'},
 {t:'Biconditional p ↔ q',d:'True when p and q have the same truth value; equivalent to (p → q) ∧ (q → p).'},
 {t:'Truth table',d:'Lists a formula’s value for every assignment of its variables; n variables give 2ⁿ rows.'},
 {t:'Tautology, contradiction, contingency',d:'Always true; always false; sometimes true and sometimes false.',ex:'p ∨ ¬p is a tautology; p ∧ ¬p is a contradiction.'},
 {t:'Satisfiable',d:'True under at least one assignment of truth values.'},
 {t:'Logical equivalence A ≡ B',d:'A and B have the same truth value in every row; equivalently A ↔ B is a tautology.'},
 {t:'De Morgan’s laws',d:'¬(p ∧ q) ≡ ¬p ∨ ¬q and ¬(p ∨ q) ≡ ¬p ∧ ¬q.'},
 {t:'Distributive laws',d:'p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r) and p ∨ (q ∧ r) ≡ (p ∨ q) ∧ (p ∨ r).'},
 {t:'Predicate',d:'A statement with variables, such as P(x): “x > 3”, which becomes a proposition once the variables are fixed or quantified.'},
 {t:'Universal quantifier ∀',d:'∀x P(x): P holds for every x in the domain. Proved with an arbitrary element; refuted by one counterexample.'},
 {t:'Existential quantifier ∃',d:'∃x P(x): P holds for at least one x in the domain. Proved by exhibiting a witness.'},
 {t:'Quantifier negation',d:'¬∀x P(x) ≡ ∃x ¬P(x) and ¬∃x P(x) ≡ ∀x ¬P(x).'},
 {t:'Order of quantifiers',d:'∀x ∃y lets y depend on x; ∃y ∀x needs one y that works for all x. Swapping them can change the truth value.'},
 {t:'Domain of discourse',d:'The set the variables range over. The same formula can be true over ℝ and false over ℚ.',ex:'∃x (x² = 2)'},
 {t:'Vacuous truth',d:'A universal statement about an empty collection is true, because no element can fail it.'},
 {t:'Modus ponens',d:'From p and p → q, conclude q.'},
 {t:'Modus tollens',d:'From ¬q and p → q, conclude ¬p.'},
 {t:'Affirming the consequent (fallacy)',d:'Concluding p from p → q and q. Invalid: q may be true for other reasons.'},
 {t:'Soundness and completeness',d:'Sound: every provable formula is valid. Complete: every valid formula is provable. Propositional and first-order logic have proof systems that are both.'}
],
proofs:[
 {t:'Theorem, lemma, corollary',d:'A theorem is a proved statement; a lemma is a helper result; a corollary follows quickly from a theorem.'},
 {t:'Conjecture',d:'A statement believed true but not yet proved.',ex:'Goldbach’s conjecture.'},
 {t:'Axiom',d:'A statement accepted without proof as a starting point.'},
 {t:'Direct proof',d:'Assume the hypothesis, use definitions and known results, reach the conclusion.'},
 {t:'Proof by contraposition',d:'Prove p → q by proving ¬q → ¬p directly.'},
 {t:'Proof by contradiction',d:'Assume the statement is false and derive an impossibility, so the statement must be true.',ex:'√2 is irrational; there are infinitely many primes.'},
 {t:'Proof by cases',d:'Split into exhaustive cases and prove the claim in each.'},
 {t:'Without loss of generality (WLOG)',d:'Handle one of several symmetric cases, because the others follow by the same argument.'},
 {t:'Counterexample',d:'One instance where a universal claim fails; it fully disproves the claim.'},
 {t:'Existence proof',d:'Shows something exists. Constructive proofs exhibit it; non-constructive proofs show it must exist without naming it.'},
 {t:'Uniqueness proof',d:'Show existence, then show any two objects with the property are equal.'},
 {t:'If and only if (iff)',d:'Prove both directions: p → q and q → p.'},
 {t:'Pigeonhole principle',d:'Putting n + 1 objects into n boxes puts at least two in one box. Generalized: N objects in k boxes put at least ⌈N/k⌉ in some box.'},
 {t:'Even, odd, divides',d:'n is even if n = 2k, odd if n = 2k + 1, and a | b if b = ak, for some integer k.'},
 {t:'Rational and irrational',d:'A rational number is p/q with integers p, q and q ≠ 0; anything real that is not rational is irrational.'},
 {t:'Evidence is not proof',d:'Checking many cases never proves a universal claim.',ex:'Pólya’s conjecture first fails at 906,150,257.'}
],
sets:[
 {t:'Set',d:'An unordered collection of distinct objects, its elements.'},
 {t:'Element x ∈ A',d:'x is a member of A; x ∉ A means it is not.'},
 {t:'Set-builder notation',d:'{x | P(x)}: all x satisfying P.'},
 {t:'Empty set ∅',d:'The set with no elements. It is a subset of every set.'},
 {t:'Subset A ⊆ B',d:'Every element of A is in B. A proper subset A ⊊ B also misses something in B.'},
 {t:'Set equality',d:'A = B exactly when A ⊆ B and B ⊆ A (extensionality).'},
 {t:'Cardinality |A|',d:'The number of elements of A, or for infinite sets, its size measured by bijections.'},
 {t:'Union, intersection',d:'A ∪ B: in A or B. A ∩ B: in both.'},
 {t:'Difference, complement',d:'A ∖ B: in A but not B. Aᶜ: in the universe U but not in A.'},
 {t:'Symmetric difference A △ B',d:'Elements in exactly one of A and B: (A ∖ B) ∪ (B ∖ A).'},
 {t:'Disjoint',d:'A ∩ B = ∅.'},
 {t:'Power set P(A)',d:'The set of all subsets of A; |P(A)| = 2^|A|.'},

  {t:'npc',x:4,y:5,sym:'g',name:'Glia',lines:['Glia: Oh! A signal! You’re awake. I’m Glia. I hold this place together while she sleeps.','Glia: She is Professor Elin Mar. She spent her whole life proving things.','Glia: Then one night she stopped. The mind went quiet, and other things moved in.','Glia: Fallacies. Each one guards a region of her reasoning. They aren’t evil. They are what is left when understanding goes missing.','Glia: You can’t fight them. A thought can’t punch a misconception. But you can REASON with them until they see clearly. Then you can show MERCY.','Glia: Arrow keys or WASD to move. Z or Enter to talk and confirm. X to go back. C opens your Codex, where everything you learn is kept.','Glia: On a phone, use the pad and buttons under the screen.','Glia: Practice on Echo, over there by the door. Echo only repeats things, but Echo is kind.'],

{id:'logic',name:'Prefrontal Cortex',sub:'the hall of mirrors',topic:'logic',variant:0,
 intro:['* The prefrontal cortex. Here she planned, judged, and decided.','* Every wall is a mirror. Every reflection is slightly wrong.'],
 npcs:[
  {sym:'⊤',name:'Tautology',lines:['Tautology: Hello! I am true. I am always true. Whatever p and q are doing, I am true.','Tautology: I am p ∨ ¬p. Some call that boring. I call it reliable.','Tautology: My cousin Contradiction is p ∧ ¬p. Always false. We don’t speak.','Tautology: Everyone else is a contingency: true in some rows of the truth table and false in others.','Tautology: A formula is satisfiable if at least one row makes it true. So everything except a contradiction is satisfiable.','Tautology: Two formulas are equivalent when they agree in every row. Put another way: A ≡ B exactly when A ↔ B is a tautology.','Tautology: With n variables the table has 2ⁿ rows. Ten variables is 1024 rows. That is why you learn the laws instead of always drawing tables.'],
   codex:[{t:'Tautology, contradiction, contingency',b:'Tautology: true in every row (p ∨ ¬p). Contradiction: false in every row (p ∧ ¬p). Contingency: neither. Satisfiable: true in at least one row. A ≡ B exactly when A ↔ B is a tautology. n variables give 2ⁿ rows.'}]},
  {sym:'∀∃',name:'The Quantifier Twins',lines:['∀: We are the quantifiers. I say “for all.”','∃: I say “there exists.” I only need one!','∀: To prove me, take an ARBITRARY element and show it works. You don’t get to pick a friendly one.','∃: To prove me, show a witness. One example is enough!','∀: To disprove me, give one counterexample. To disprove ∃, you must show nothing works, and that is a ∀.','∃: When you negate us, we swap and the negation moves inward: ¬∀x P(x) ≡ ∃x ¬P(x), and ¬∃x P(x) ≡ ∀x ¬P(x).','∀: Order matters. ∀x ∃y (y > x) is true on the integers. ∃y ∀x (y > x) is false. In the first one, y may depend on x.','∃: And watch the domain. ∃x (x² = 2) is false over ℚ and true over ℝ.','∀: One more. “All unicorns can fly” is TRUE. Vacuously. There are no unicorns to fail.','∃: He loves that one.'],
   codex:[{t:'Quantifiers in practice',b:'Prove ∀ with an arbitrary element; prove ∃ with a witness. Disprove ∀ with one counterexample. Negation swaps the quantifier: ¬∀x P ≡ ∃x ¬P. Order matters (∀x∃y vs ∃y∀x). The domain changes truth (x² = 2 over ℚ vs ℝ). A universal claim about an empty set is vacuously true.'}]}],
 journal:['* A page torn along one edge.','* “Found it. Lemma 7 says: if a graph is sparse-enough, it has property K. In Chapter 3 I wrote: it has property K, therefore it is sparse-enough. I used the converse. Six years ago. Nobody noticed. I didn’t either. — E.”'],
 boss:{id:'converse',name:'The Converse',sym:'⇄',mirror:true,orbit:6,need:4,pat:['rain','sweep'],glyphs:['¬','∧','∨','→','↔'],
  pre:['The Converse: Ah, a visitor! Let me reason about you.','The Converse: If something is a thought, it moves. You move. Therefore you are a thought!','The Converse: ...that one happens to be true. But my method is flawless!','The Converse: If she is a real mathematician, her proofs work. Her proof didn’t work... no, wait. Her proof... it’s all backwards in here.','The Converse: Reason with me. Help me read the mirror.'],
  intro:['* The Converse reflects everything you say. Backwards.'],
  asks:['The Converse: Hint? If p → q, then ¬q → ¬p is the same promise. q → p is a different promise.','The Converse: Hint? An implication only breaks when the front is true and the back is false.','The Converse: Hint? To negate “for all”, you only need one exception.','The Converse: Hint? De Morgan: negating “and” gives “or”, and negating “or” gives “and”.'],
  right:['The Converse: Oh. Oh, that’s the right direction.','The Converse: My reflection blinked first.','The Converse: Forwards... it reads better forwards.'],
  wrong:['The Converse: Ha! You see it my way!','The Converse: Mirror, mirror...'],
  notyet:'The Converse: Spare me? I still believe q gives me p!',
  spare:['The Converse: So p → q, and q... tells me nothing about p.','The Converse: Then she didn’t fail because she isn’t a mathematician. She failed because she read one lemma backwards.','The Converse: That is a mistake. Mistakes have a direction. They can be walked back.','* You spared The Converse. A mirror cracks and lets the light through.'],
  post:['The Converse: I read everything forwards now. It’s slower. It’s correct.']}
},

{id:'proofs',name:'Hippocampus',sub:'the archive',topic:'proofs',variant:1,
 intro:['* The hippocampus: where memories are filed.','* Shelves of examples stretch out of sight. Every one is stamped VERIFIED.'],
 npcs:[
  {sym:'⊥',name:'Contra',lines:['Contra: I am Contra. My method looks dramatic, but it is simple.','Contra: To prove S, assume ¬S. Reason until you reach something impossible: a statement and its negation, together.','Contra: True premises can’t lead to a falsehood. So the assumption ¬S was wrong, and S holds.','Contra: People confuse me with my sibling, Contraposition. To prove P → Q, Contraposition proves ¬Q → ¬P directly. No contradiction needed.','Contra: Rule of thumb: try a direct proof first. Use contraposition when ¬Q is easier to work with. Call me when the claim says “not”, “no”, or “infinitely many”.','Contra: √2 is irrational? That’s a “not”. Infinitely many primes? Assume finitely many and build N = p₁p₂⋯pₙ + 1. You see the pattern.'],
   codex:[{t:'Contradiction vs contraposition',b:'Contradiction: assume ¬S, derive an impossibility, conclude S. Contraposition: prove P → Q by proving ¬Q → ¬P directly. Try direct proof first; contraposition when ¬Q is concrete; contradiction for “not”, “no”, “infinitely many” (√2 irrational, infinitely many primes).'}]},
  {sym:'∨',name:'Casey',lines:['Casey: Cases! Split the world into pieces you can handle, and handle every piece.','Casey: The pieces must be exhaustive. Even or odd. Positive, zero, or negative. Miss one and the proof has a hole.','Casey: When cases are symmetric, write “without loss of generality, assume x ≤ y” and do just one.','Casey: My friend the Pigeon says: put n + 1 letters in n mailboxes and some box gets two. More generally, N things in k boxes puts at least ⌈N/k⌉ in one box.','Casey: Simple, but it proves surprising things. In any group of 6 people, there are 3 mutual friends or 3 mutual strangers. That’s Ramsey’s R(3,3) = 6, proved with pigeons and cases.'],
   codex:[{t:'Cases, WLOG, pigeonhole',b:'Proof by cases needs an exhaustive split. WLOG skips symmetric cases. Pigeonhole: n + 1 objects in n boxes share a box; N objects in k boxes put at least ⌈N/k⌉ in one. Example: R(3,3) = 6.'}]},
  {sym:'#',name:'The Archivist',lines:['The Archivist: Want a warning from the stacks?','The Archivist: In 1919 George Pólya conjectured something about how many prime factors numbers have. It was checked for millions of numbers.','The Archivist: In 1958 a counterexample was proved to exist. The smallest one is 906,150,257.','The Archivist: Euler conjectured you need at least n nth powers to sum to an nth power. In 1966 a computer found 27⁵ + 84⁵ + 110⁵ + 133⁵ = 144⁵.','The Archivist: Examples are wonderful for guessing. They prove nothing about “for all”.','The Archivist: But one counterexample is a complete proof that a “for all” is false. Remember that. It matters here.'],
   codex:[{t:'Why examples are not proofs',b:'Pólya’s conjecture held for every n below 906,150,257, then failed. Euler’s sum-of-powers conjecture fell to 27⁵ + 84⁵ + 110⁵ + 133⁵ = 144⁵. Checking cases suggests; only proof establishes. One counterexample fully disproves a universal claim.'}]}],
 journal:['* The ink is smudged, as if it got wet.','* “Tomas emailed at 3 a.m. A single number, twelve digits long. My conjecture fails there. We had checked up to a billion. He apologized four times in one email. I didn’t reply. — E.”'],
 boss:{id:'anecdote',name:'Anecdote',sym:'✓',orbit:9,need:4,pat:['aimed','rain'],glyphs:['✓','∴','∵','✓'],
  pre:['Anecdote: Welcome to my archive! Ten thousand examples, every one verified!','Anecdote: n² + n + 41 is prime for n = 0, 1, 2, all the way to 39! Forty examples! Surely it’s ALWAYS prime!','Anecdote: (Don’t check n = 40. Please don’t check n = 40.)','Anecdote: She checked a billion cases. A BILLION. How can a billion examples be wrong?'],
  intro:['* Anecdote shuffles a stack of examples, very fast.'],
  asks:['Anecdote: Hint? A universal claim needs a proof that covers an arbitrary case.','Anecdote: Hint? One counterexample beats a billion examples.','Anecdote: Hint? Pick the method that fits the shape of the claim: direct, contrapositive, contradiction, cases.'],
  right:['Anecdote: ...that’s a proof. Not a pile. A proof.','Anecdote: One shelf just got lighter.','Anecdote: Fine. FINE. n = 40 gives 1681 = 41². Not prime.'],
  wrong:['Anecdote: See? Another example for my collection!','Anecdote: Verified! (Probably.)'],
  notyet:'Anecdote: You can’t spare me yet. I have 9,999 more examples.',
  spare:['Anecdote: So a billion examples was never a proof. And one counterexample is.','Anecdote: Then Tomas’s number isn’t an insult. It’s a theorem: “there exists an n where the conjecture fails.” It is TRUE, and it is PROVED.','Anecdote: She should have read that email as a gift.','* You spared Anecdote. The shelves quietly relabel themselves: EVIDENCE, not PROOF.'],
  post:['Anecdote: I’m keeping the examples. They’re good for guessing.']}
},

{id:'sets',name:'Temporal Lobe',sub:'the library of collections',topic:'sets',variant:2,
 intro:['* The temporal lobe. Names, categories, the sorting of things into kinds.','* Boxes inside boxes inside boxes. One box is labelled “all boxes that don’t contain themselves.” It is shaking.'],
 npcs:[
  {sym:'∅',name:'Empty',lines:['∅: Hi. I’m the empty set. I contain nothing. People think that makes me nothing. It doesn’t.','∅: I’m a subset of every set. To be a subset of A, every element of me must be in A. I have no elements, so I pass every test.','∅: But I’m not an element of every set. ∅ ⊆ {1, 2} is true. ∅ ∈ {1, 2} is false.','∅: And {∅} is not me. It’s a box holding an empty box. It has one element.','∅: You can build all the natural numbers from me: 0 = ∅, 1 = {∅}, 2 = {∅, {∅}}, and n + 1 = n ∪ {n}. Von Neumann did.','∅: Not bad for nothing.'],
   codex:[{t:'The empty set',b:'∅ ⊆ A for every A (vacuously), but ∅ ∈ A only if listed. {∅} ≠ ∅: it has one element. |P(∅)| = 1. Von Neumann naturals: 0 = ∅, 1 = {∅}, 2 = {∅, {∅}}, n + 1 = n ∪ {n}.'}]},
  {sym:'∞',name:'Hilbert',lines:['Hilbert: Welcome to my hotel. Infinitely many rooms, every one occupied.','Hilbert: A new guest? Everyone moves from room n to room n + 1. Room 1 is free.','Hilbert: Infinitely many new guests? Everyone moves to room 2n. All the odd rooms are free.','Hilbert: Two sets have the same size when there is a bijection between them. ℕ, ℤ and even ℚ are the same size. We call them countable.','Hilbert: But a coach of guests, one for every infinite string of 0s and 1s? I cannot fit them. Cantor showed why.','Hilbert: Suppose you had a list. Build a new string by flipping the nth digit of the nth guest. It differs from everyone on the list. So no list works.','Hilbert: That’s the diagonal argument. P(ℕ) and ℝ are uncountable. And Cantor’s theorem says |P(A)| > |A| for every set: there is no biggest infinity.'],
   codex:[{t:'Countable and uncountable',b:'Same size means a bijection exists. ℕ, ℤ, ℚ, ℕ × ℕ are countable (Hilbert’s hotel shifts n ↦ n + 1, n ↦ 2n). Diagonal argument: any list of infinite binary strings misses the string flipping each nth digit of the nth entry, so P(ℕ) and ℝ are uncountable. Cantor: |P(A)| > |A| always.'}]}],
 journal:['* The page has been folded and unfolded many times.','* “I keep asking whether I can trust the mind that made the mistake. But it is the only mind I have to check the mistake with. Is that circular? — E.”'],
 boss:{id:'russell',name:'Russell’s Set',sym:'∈',flicker:['∈','∉'],orbit:7,need:4,pat:['bounce','ring'],glyphs:['∈','∉','⊆','∅','∪','∩'],
  pre:['Russell’s Set: Do I contain myself?','Russell’s Set: I am the set of all sets that do not contain themselves. If I contain myself, I shouldn’t. If I don’t, I should.','Russell’s Set: In. Out. In. Out. I flip forever.','Russell’s Set: She does it too. Can a mind that doubts itself trust its own doubt? In. Out.'],
  intro:['* Russell’s Set flickers between in and out.'],
  asks:['Russell’s Set: Hint? ∈ means “is an element of”. ⊆ means “every element is also in”.','Russell’s Set: Hint? A set with n elements has 2ⁿ subsets.','Russell’s Set: Hint? Two sets are equal when they have exactly the same elements.','Russell’s Set: Hint? Countable means you can list it, one by one, missing nothing.'],
  right:['Russell’s Set: ...that settled one flip.','Russell’s Set: In. Just in. For a moment it was quiet.','Russell’s Set: A definite answer. I’d forgotten what those feel like.'],
  wrong:['Russell’s Set: In! Out! In!','Russell’s Set: The paradox grows.'],
  notyet:'Russell’s Set: You can’t spare something that might not exist!',
  spare:['Russell’s Set: So the answer is... I’m not a set at all?','Russell’s Set: Not every description makes a set. Mathematicians fixed this with axioms: you may only carve a set out of a set you already have.','Russell’s Set: I was never a contradiction in the world. I was a badly asked question.','Russell’s Set: Maybe her doubt is like me. Not proof that she is broken. Just a question that needs better axioms.','* You spared Russell’s Set. It stops flickering and settles, gently, outside every box.'],
  post:['Russell’s Set: I live outside the library now. The view is lovely.']}
},

{id:'func',name:'Parietal Lobe',sub:'the switchyard',topic:'func',variant:0,
 intro:['* The parietal lobe. Where things are mapped onto other things: hands onto space, words onto meaning.','* Rails split and merge. Two tracks run into one and never come apart again.'],
 npcs:[
  {sym:'↔',name:'Pairing',lines:['Pairing: I match things up. One to one, nobody left out. That makes me a bijection.','Pairing: Injective means no two inputs share an output. Picture arrows: no two land on the same point.','Pairing: Surjective means every point of the codomain gets hit by some arrow.','Pairing: For finite sets of the same size, injective and surjective are the same thing. For infinite sets, no: n ↦ n + 1 on ℕ is injective but never hits 0.','Pairing: The image f(A) is everything that gets hit. The preimage f⁻¹(B) is everything that lands in B. Preimages exist even when no inverse does.','Pairing: Counting: from an m-set to an n-set there are nᵐ functions, and n!/(n − m)! of them are injective.'],
   codex:[{t:'Injections, surjections, images',b:'Injective: no shared outputs. Surjective: every codomain point hit. Bijective: both, so an inverse exists. Finite equal-size sets: injective ⇔ surjective; on ℕ, n ↦ n + 1 is injective, not surjective. Images and preimages exist for every function. nᵐ functions from an m-set to an n-set, n!/(n − m)! injective.'}]},
  {sym:'≤',name:'Order',lines:['Order: I arrange things. Not always in a line, though.','Order: A partial order is reflexive, antisymmetric and transitive. Like ⊆ on sets, or “divides” on positive integers.','Order: “Partial” means some pairs are incomparable. 2 doesn’t divide 3, and 3 doesn’t divide 2.','Order: If every pair is comparable, like ≤ on numbers, I’m a total order.','Order: Draw me as a Hasse diagram: bigger things higher, connect only covering pairs, leave out loops and anything transitivity implies.','Order: My cousin the equivalence relation is reflexive, symmetric and transitive. It doesn’t rank. It groups things into classes that never overlap.'],
   codex:[{t:'Partial orders and equivalence',b:'Partial order: reflexive, antisymmetric, transitive (⊆, divides). Some pairs may be incomparable; a total order has none. Hasse diagrams show only covering pairs. Equivalence relation: reflexive, symmetric, transitive; it partitions the set into disjoint classes.'}]}],
 journal:['* A conference program, with one line crossed out in pencil.','* “The conference website lists my talk as WITHDRAWN. A one-way function: talk ↦ withdrawn. I can’t find an inverse. — E.”'],
 boss:{id:'collision',name:'The Collision',sym:'⤨',orbit:8,need:4,pat:['sweep','aimed'],glyphs:['↦','→','∘','f'],
  pre:['The Collision: Two things came to me. I sent them both to the same place.','The Collision: Now when someone asks “where did this come from?”, I can’t answer. I’m not injective.','The Collision: I can never be undone. There is no f⁻¹ for me.','The Collision: She feels like me. Something happened that cannot be reversed.'],
  intro:['* Two tracks run into The Collision. Only one comes out.'],
  asks:['The Collision: Hint? Injective: f(a) = f(b) forces a = b.','The Collision: Hint? Surjective: everything in the codomain gets hit.','The Collision: Hint? An equivalence relation is reflexive, symmetric and transitive.','The Collision: Hint? A two-sided inverse needs a bijection.'],
  right:['The Collision: You understand the arrows.','The Collision: Something untangled.','The Collision: Yes. That is how mapping works.'],
  wrong:['The Collision: Another collision.','The Collision: Everything lands in the same place.'],
  notyet:'The Collision: Mercy? I can’t even undo myself.',
  spare:['The Collision: I can’t be inverted. But the things that collide in me form classes: a ~ b when f(a) = f(b).','The Collision: That’s an equivalence relation. And on those classes, I AM injective.','The Collision: I can’t be undone. But I can be understood. That is a different kind of inverse.','The Collision: A withdrawn talk can’t be un-withdrawn. She can still give the next one.','* You spared The Collision. The two tracks stay merged, and now they are labelled.'],
  post:['The Collision: Restrict my domain and I behave. x² on [0, ∞) has an inverse. Funny, that.']}
},

{id:'ind',name:'Cerebellum',sub:'the long stair',topic:'ind',variant:1,
 intro:['* The cerebellum. It learns by repetition: one step, then the next, until walking needs no thought.','* A staircase climbs forever. At the bottom stands a single domino. It refuses to fall.'],
 npcs:[
  {sym:'n',name:'Stairwright',lines:['Stairwright: I build stairs. Infinite ones. The trick is, I never build them all.','Stairwright: I build the first step. Then I prove that whenever step k exists, step k + 1 can be built on it.','Stairwright: That’s induction. Base case: P(n₀). Inductive step: P(k) → P(k + 1) for every k ≥ n₀.','Stairwright: Write it properly. “Assume P(k) for an arbitrary k ≥ n₀.” Then show exactly where you use it. If you never use it, it wasn’t induction.','Stairwright: Example: 3 divides n³ − n. Base: 0³ − 0 = 0. Step: (k + 1)³ − (k + 1) = (k³ − k) + 3k² + 3k. The first part is divisible by 3 by hypothesis, the rest plainly is.','Stairwright: The base isn’t always 0. 2ⁿ > n² fails for n = 2, 3, 4 and holds from n = 5 on. Choose your base carefully.'],
   codex:[{t:'Writing an induction proof',b:'State P(n). Prove the base P(n₀). Assume P(k) for arbitrary k ≥ n₀, prove P(k + 1), and point out where the hypothesis is used. Example: 3 | n³ − n since (k + 1)³ − (k + 1) = (k³ − k) + 3(k² + k). Bases matter: 2ⁿ > n² holds only from n = 5.'}]},
  {sym:'Fₙ',name:'Recursion',lines:['Recursion: Hello, hello, hello. I define things in terms of smaller versions of themselves.','Recursion: Fibonacci: F₀ = 0, F₁ = 1, Fₙ = Fₙ₋₁ + Fₙ₋₂. Two base cases, because each step looks two back.','Recursion: That’s why proofs about me use strong induction: you may assume every earlier case, not just the last.','Recursion: Strings, trees and formulas are recursive too. A binary tree is either empty, or a root with two binary subtrees.','Recursion: To prove things about them, use structural induction: prove it for the base objects, then show every construction rule preserves it.','Recursion: Recursion and induction are one idea seen from two sides. One builds. The other proves.'],
   codex:[{t:'Recursion and strong induction',b:'Recursive definitions build objects from smaller ones (Fibonacci needs two bases). Strong induction assumes all earlier cases. Structural induction proves a property for base objects and shows each constructor preserves it. Recursion builds; induction proves.'}]}],
 journal:['* A sticky note, stuck to nothing.','* “Students keep emailing. ‘One step at a time, Professor.’ I taught them that. I can’t take the first one. — E.”'],
 boss:{id:'domino',name:'Domino',sym:'▯',orbit:6,need:4,pat:['rain','bounce'],glyphs:['n','k','+1','∎'],
  pre:['Domino: Don’t push me.','Domino: If I fall, the next one falls, and the next, forever. Everything depends on me.','Domino: What if I’m wrong? What if the first step is the false one?','Domino: She hasn’t opened her notebook in months. If the first page is wrong, the whole book is wrong.'],
  intro:['* Domino stands very, very still.'],
  asks:['Domino: Hint? You need BOTH a base case and an inductive step.','Domino: Hint? Strong induction assumes every case up to k.','Domino: Hint? Check that the step really works even for the smallest k.'],
  right:['Domino: The base case... holds. I checked. It holds.','Domino: The step from me to the next one is sound.','Domino: I wobbled. On purpose.'],
  wrong:['Domino: See? Things go wrong!','Domino: I’m not moving.'],
  notyet:'Domino: Not yet. I need to check the base case again.',
  spare:['Domino: The base case is true. And whenever a domino falls, the next one falls.','Domino: Then I don’t have to be brave about all of them. Just about me. Just one step.','Domino: Here goes.','* The domino tips. The sound of falling dominoes goes on, up the stairs, for a very long time.','* You spared Domino.'],
  post:['Domino: I’m lying down now. It’s very restful being a completed proof.']}
},

{id:'num',name:'Basal Ganglia',sub:'the clockworks',topic:'num',variant:2,
 intro:['* The basal ganglia: rhythm, habit, timing.','* Gears tick in perfect cycles. Every cycle leaves a little something left over.'],
 npcs:[
  {sym:'gcd',name:'Euclid',lines:['Euclid: Greetings. I am old. My algorithm is older than most of your languages.','Euclid: To find gcd(a, b): divide, keep the remainder, repeat. gcd(a, b) = gcd(b, a mod b). When the remainder hits 0, the last nonzero one is the answer.','Euclid: Why does it work? Anything dividing a and b also divides a − qb, the remainder. The common divisors never change.','Euclid: It is fast. The numbers at least halve every two steps.','Euclid: Run it backwards and you get Bézout: gcd(a, b) = ax + by for some integers x and y.','Euclid: From that comes my lemma: if a prime p divides ab, then p divides a or p divides b. That is why prime factorizations are unique.'],
   codex:[{t:'Euclid, Bézout, unique factorization',b:'gcd(a, b) = gcd(b, a mod b); stop at remainder 0. Divisors are preserved because d | a, d | b ⇒ d | a − qb. Back-substitution gives Bézout: gcd = ax + by. Euclid’s lemma: p | ab ⇒ p | a or p | b, which gives unique prime factorization.'}]},
  {sym:'mod',name:'The Clockmaker',lines:['The Clockmaker: On my clocks, 9 + 5 = 2. That’s arithmetic mod 12.','The Clockmaker: a ≡ b (mod n) means n divides a − b. Add, subtract, multiply, and reduce whenever you like.','The Clockmaker: Division is trickier. a has an inverse mod n exactly when gcd(a, n) = 1. Find it with extended Euclid.','The Clockmaker: Mod a prime p, every nonzero number has an inverse, and Fermat says aᵖ⁻¹ ≡ 1. For any n, Euler says a^φ(n) ≡ 1 when gcd(a, n) = 1.','The Clockmaker: For big powers, square repeatedly. 3⁶⁴ is six squarings, not sixty-three multiplications.','The Clockmaker: RSA: pick primes p and q, publish n = pq and e, keep d with ed ≡ 1 mod φ(n). Encrypt with mᵉ, decrypt with cᵈ. Without p and q, nobody can find φ(n).'],
   codex:[{t:'Modular arithmetic and RSA',b:'a ≡ b (mod n) ⇔ n | a − b. Add and multiply freely; an inverse exists iff gcd(a, n) = 1. Fermat: aᵖ⁻¹ ≡ 1 (mod p). Euler: a^φ(n) ≡ 1. Fast exponentiation by repeated squaring. RSA: n = pq public, ed ≡ 1 mod φ(n), encrypt mᵉ, decrypt cᵈ.'}]}],
 journal:['* Written on the back of a seminar flyer.','* “Tomas told me once he never felt he belonged in my group. Everyone else divided evenly into the work, he said. He was the remainder. He found the counterexample alone, on a Sunday. — E.”'],
 boss:{id:'remainder',name:'The Remainder',sym:'r',lone:true,orbit:6,need:4,pat:['ring','sweep'],glyphs:['0','1','2','3','7','≡'],
  pre:['The Remainder: Everyone divides evenly. Everyone except me.','The Remainder: I’m what is left over. The part that doesn’t fit.','The Remainder: Nobody wants a remainder. They round me off.'],
  intro:['* The Remainder sits a little apart from everything else.'],
  asks:['The Remainder: Hint? a = qn + r with 0 ≤ r < n. I’m r.','The Remainder: Hint? An inverse mod n exists exactly when gcd(a, n) = 1.','The Remainder: Hint? Reduce at every step. You never need the huge number.','The Remainder: Hint? Fermat: aᵖ⁻¹ ≡ 1 mod a prime p, if p doesn’t divide a.'],
  right:['The Remainder: ...you used me. Just me. Not the quotient.','The Remainder: That whole answer was built from remainders.','The Remainder: I mattered there.'],
  wrong:['The Remainder: Rounded off again.','The Remainder: Nobody counts the leftovers.'],
  notyet:'The Remainder: Spare me? You haven’t even used me yet.',
  spare:['The Remainder: Wait. All of modular arithmetic is remainders. Clocks. Calendars. Cryptography.','The Remainder: The quotient says how many times something fit. The remainder says what is special about it.','The Remainder: Tomas was the remainder. That’s why he saw what the rest of them couldn’t.','* You spared The Remainder. Somewhere, a lock clicks open.'],
  post:['The Remainder: 17 mod 5 is 2. I’m the 2. I’m proud of it.']}
},

{id:'count',name:'Occipital Lobe',sub:'the abacus fields',topic:'count',variant:0,
 intro:['* The occipital lobe, where she learned to see patterns.','* Fields of abacus beads in every direction. Something has been counting them, and counting them again.'],
 npcs:[
  {sym:'C',name:'Choosy',lines:['Choosy: Before you count anything, ask two questions. Does order matter? Are repeats allowed?','Choosy: Order matters, repeats allowed: nᵏ. Passwords.','Choosy: Order matters, no repeats: n!/(n − k)!. Podium finishes.','Choosy: Order doesn’t matter, no repeats: C(n, k) = n!/(k!(n − k)!). Committees.','Choosy: Order doesn’t matter, repeats allowed: C(n + k − 1, k). Donuts. Stars and bars.','Choosy: Stuck? Count the ordered version, then divide by how many times each answer got counted.'],

  {sym:'△',name:'Pascal',lines:['Pascal: My triangle! Each entry is the sum of the two above it: C(n, k) = C(n − 1, k − 1) + C(n − 1, k).','Pascal: Why? A chosen subset either contains a special element or it doesn’t. That’s a combinatorial proof: count one thing two ways.','Pascal: Row n sums to 2ⁿ: every subset of an n-set. And C(n, k) = C(n, n − k): choosing what to take is choosing what to leave.','Pascal: The binomial theorem: (x + y)ⁿ = Σ C(n, k) xᵏ yⁿ⁻ᵏ.','Pascal: For overlaps, inclusion–exclusion: |A ∪ B ∪ C| = |A| + |B| + |C| − |A ∩ B| − |A ∩ C| − |B ∩ C| + |A ∩ B ∩ C|.','Pascal: Add the singles, subtract the pairs, add the triples. Keep alternating.'],

{id:'prob',name:'Amygdala',sub:'the house of chance',topic:'prob',variant:1,
 intro:['* The amygdala: fear, hope, the feeling in your gut before a decision.','* Dice roll on every table. A wheel spins and spins. Someone is very sure their luck is about to change.'],
 npcs:[
  {sym:'P(|)',name:'Bayes',lines:['Bayes: Hoo. Let me tell you about tests.','Bayes: A disease affects 1 person in 1000. A test catches it 99% of the time, and wrongly flags 1% of healthy people.','Bayes: You test positive. What’s the chance you’re sick? Most people say 99%. It’s about 9%.','Bayes: Picture 100,000 people. 100 are sick, and 99 of them test positive. 99,900 are healthy, and 999 of them test positive too. 99 out of 1098 is about 9%.','Bayes: That’s my rule: P(A | B) = P(B | A) P(A) / P(B). The base rate P(A) matters enormously.','Bayes: And conditional probability, P(A | B) = P(A ∩ B)/P(B), just means: shrink the world to B, then measure A inside it.'],
   codex:[{t:'Conditioning and Bayes',b:'P(A | B) = P(A ∩ B)/P(B): restrict the sample space to B. Bayes: P(A | B) = P(B | A)P(A)/P(B). Base rates dominate: at 1/1000 prevalence, a test with 99% sensitivity and 1% false positives gives only about a 9% chance of disease after a positive result.'}]},
  {sym:'E',name:'Expectation',lines:['Expectation: I’m the average you’d get if you repeated something forever.','Expectation: E[X] = Σ x · P(X = x). For a die, (1 + 2 + ⋯ + 6)/6 = 3.5. You can’t roll it. It’s still the right average.','Expectation: My superpower is linearity: E[X + Y] = E[X] + E[Y], even when X and Y depend on each other.','Expectation: Trick: write a count as a sum of indicators. n people grab hats at random. Expected number who get their own? Each does with probability 1/n, so 1 in total.','Expectation: Spread is variance: Var(X) = E[X²] − E[X]². Variances of independent variables add.','Expectation: Markov: P(X ≥ a) ≤ E[X]/a for X ≥ 0. Chebyshev: P(|X − μ| ≥ kσ) ≤ 1/k². Averages of many trials concentrate: the law of large numbers.'],
   codex:[{t:'Expectation, variance, bounds',b:'E[X] = Σ x P(X = x). Linearity holds without independence; use indicator variables (expected fixed points of a random permutation = 1). Var(X) = E[X²] − E[X]², additive when independent. Markov: P(X ≥ a) ≤ E[X]/a. Chebyshev: P(|X − μ| ≥ kσ) ≤ 1/k². Law of large numbers.'}]}],
 journal:['* A betting slip. On the back, a note.','* “Nineteen years without a breakthrough. I told myself I was due. As if the universe kept a ledger. — E.”'],

  intro:['* The Gambler shuffles a deck with no aces in it.'],
  asks:['The Gambler: Hint? Independent events don’t remember each other.','The Gambler: Hint? Count outcomes in the event and divide by all outcomes.','The Gambler: Hint? Expectation adds up, even for dependent variables.'],

{id:'rec',name:'Auditory Cortex',sub:'epilogue · the hall of echoes',topic:'rec',variant:0,
 intro:['* Epilogue: Night School.','* Six months on, Elin teaches again. Her mind is busy, and new rooms have grown in it.','* Here, every sound is built from the sounds before it. Somewhere ahead, something keeps eating its own tail.'],
 npcs:[
  {sym:'ʘ',name:'Pip the Rabbit',lines:['Pip: Hello! Every month each pair of us makes a new pair, but only once they are a month old.','Pip: So the number of pairs this month is last month’s pairs plus the pairs from two months ago. F(n) = F(n − 1) + F(n − 2).','Pip: Start with F(0) = 0 and F(1) = 1 and you get 0, 1, 1, 2, 3, 5, 8, 13…','Pip: To solve a rule like that, guess F(n) = rⁿ. You get r² = r + 1. The two roots are the golden ratio and its little sibling.','Pip: Every solution is A·r₁ⁿ + B·r₂ⁿ. The two starting values choose A and B. If a root repeats, use (A + Bn)·rⁿ instead.'],
   codex:[{t:'Linear recurrences',b:'Fibonacci: Fₙ = Fₙ₋₁ + Fₙ₋₂ with F₀ = 0, F₁ = 1. Try aₙ = rⁿ to get the characteristic equation. Distinct roots: A·r₁ⁿ + B·r₂ⁿ. Repeated root r: (A + Bn)·rⁿ. Initial values fix A and B.'}]},
  {sym:'≡',name:'The Tower Monk',lines:['The Tower Monk: I move discs between three pegs, never a large one on a small one.','The Tower Monk: To move n discs: move n − 1 aside, move the big one, move n − 1 back on top. So T(n) = 2T(n − 1) + 1.','The Tower Monk: Unroll it: 1, 3, 7, 15, 31. Guess T(n) = 2ⁿ − 1, then prove it by induction.','The Tower Monk: My younger brothers split problems in half instead. T(n) = 2T(n/2) + n is merge sort: n log n.','The Tower Monk: The master theorem compares a with bᵈ. Who wins, the leaves or the root, decides the answer.'],
   codex:[{t:'Unrolling and divide and conquer',b:'Unroll a recurrence, guess a closed form, prove it by induction. Hanoi: T(n) = 2ⁿ − 1. Master theorem for T(n) = aT(n/b) + nᵈ: Θ(nᵈ) if a < bᵈ, Θ(nᵈ log n) if a = bᵈ, Θ(n^(log_b a)) if a > bᵈ.'}]}],
 journal:['* A lesson plan, half written.','* “Week 10: recurrences. Remind them a recursive definition is not circular. It has a place to start. — E.M.”'],
 boss:{id:'ouro',name:'Ouroboros',sym:'∞',orbit:10,need:5,pat:['ring','rain','sweep'],glyphs:['ₙ','₋','₁','∞','r²'],
  pre:['Ouroboros: Every step needs the step before it. And that one needs the one before that.','Ouroboros: Down and down forever. So nothing can ever be known. I eat my own tail, and so does every recursion.','Ouroboros: She is the same. She can’t start the new paper until she fixes the old one, and she can’t fix that until…'],
  intro:['* Ouroboros coils around the hall.'],
  asks:['Ouroboros: Hint? Find where the chain begins. The initial values.','Ouroboros: Hint? Try aₙ = rⁿ and solve for r.','Ouroboros: Hint? Compare a with bᵈ.'],
  right:['Ouroboros: ...the chain stops there. It has a bottom.','Ouroboros: You didn’t need every step. You found the formula.','Ouroboros: My tail slips out of my mouth.'],
  wrong:['Ouroboros: Round and round.','Ouroboros: Back to the start. Forever.'],

const SLOTS={stones:[[3,2],[9,2],[3,11],[9,11]],npcs:[[13,3],[13,10],[9,5]],journal:[6,10],save:[2,7]};
function topicLesson(id){return id&&typeof LESSONS!=='undefined'?LESSONS[id]:null}
let R=null;// current room runtime
function buildRoom(i){const def=ROOMS[i];const map=[...Array(ROWS)].map((_,r)=>[...Array(COLS)].map((_,c)=>(r===0||c===0||r===ROWS-1||c===COLS-1)?1:0));
  if(i>0)for(const r of[6,7,8])map[r][0]=0;if(i<ROOMS.length-1)for(const r of[6,7,8])map[r][COLS-1]=0;
  for(const[x,y,w,h]of(def.blocks||VARIANTS[def.variant||0]))for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)map[yy][xx]=1;
  const ents=[];
  if(def.ents)def.ents.forEach((e,k)=>ents.push({...e,key:def.id+':e'+k}));
  else{const L=topicLesson(def.topic);
    L.ideas.forEach((d,k)=>ents.push({t:'stone',x:SLOTS.stones[k][0],y:SLOTS.stones[k][1],idea:d,key:def.id+':s'+k}));
    def.npcs.forEach((n,k)=>ents.push({t:'npc',...n,x:SLOTS.npcs[k][0],y:SLOTS.npcs[k][1],key:def.id+':n'+k}));
    ents.push({t:'journal',x:SLOTS.journal[0],y:SLOTS.journal[1],lines:def.journal,name:'Journal: '+def.name,key:def.id+':j'});
    ents.push({t:'save',x:SLOTS.save[0],y:SLOTS.save[1],key:def.id+':save'})}
  ents.filter(e=>e.t==='stone'&&e.custom).forEach(e=>e.idea=e.custom);
  ents.forEach(e=>{if(e.t==='journal')e.key=e.key||def.id+':j'});
  const boss={x:16,y:7,...def.boss,t:'boss',key:def.id+':boss'};ents.push(boss);
  // background constellation for the room
  let seed=i*977+13;const rr=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const stars=[...Array(26)].map(()=>[TS+rr()*(CW-2*TS),OY+TS+rr()*(ROWS-2)*TS]);
  R={i,def,map,ents,boss,stars};
}

let DLG=null;
function wrap(text,font,maxW){g.font=font;const out=[];for(const para of text.split('\n')){const words=para.split(' ');let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}out.push(cur)}return out}
function paginate(entries,maxW,per){const pages=[];for(const raw0 of entries){const raw=raw0.replace(/`/g,'');let who=null,text=raw;if(!raw.startsWith('* ')){const m=raw.match(/^([^:*]{1,30}): (.*)$/);if(m){who=m[1];text=m[2]}}
  const lines=wrap(text,'16px '+MONO,maxW);for(let i=0;i<lines.length;i+=per)pages.push({who,lines:lines.slice(i,i+per),len:lines.slice(i,i+per).join('').length})}return pages}
function say(entries,onEnd,opts={}){DLG={pages:paginate(entries,opts.w||548,opts.per||3),i:0,shown:0,onEnd,box:opts.box};}
function updDialog(dt){const p=DLG.pages[DLG.i];if(!p){const f=DLG.onEnd;DLG=null;f&&f();return}
  if(DLG.shown<p.len){const before=Math.floor(DLG.shown);DLG.shown+=1.5*dt*(held.b?4:1);if(Math.floor(DLG.shown/3)>Math.floor(before/3))sfx.blip()}
  if(take('a')||take('b')){if(DLG.shown<p.len)DLG.shown=p.len;else{DLG.i++;DLG.shown=0;if(DLG.i>=DLG.pages.length){const f=DLG.onEnd;DLG=null;f&&f()}}}}
function box(x,y,w,h,a=.95){g.fillStyle=`rgba(8,8,7,${a})`;g.fillRect(x,y,w,h);g.strokeStyle=yc(.95);g.lineWidth=2;g.strokeRect(x+1,y+1,w-2,h-2)}
function drawPage(p,x,y,shown){let ty=y+26;if(p.who){g.font='italic 19px '+SERIF;g.fillStyle=yc(.62);g.fillText(p.who,x+20,ty);ty+=24}
  g.font='16px '+MONO;g.fillStyle=yc(1);let left=shown;for(const ln of p.lines){if(left<=0)break;g.fillText(ln.slice(0,Math.floor(left)),x+20,ty);left-=ln.length;ty+=25}
  if(shown>=p.len){g.fillStyle=yc(.5+.5*Math.sin(performance.now()/180));g.beginPath();const bx=x+566,by=y+(p.who?118:108);g.moveTo(bx-5,by-4);g.lineTo(bx+5,by-4);g.lineTo(bx,by+2);g.fill()}}

/* interactions */
function nearEnt(){let best=null,bd=40;for(const e of R.ents){const ex=e.x*TS+TS/2,ey=OY+e.y*TS+TS/2;const d=Math.hypot(ex-PL.x,ey-PL.y);if(d<bd){bd=d;best=e}}return best}
function interact(e){
  if(e.t==='save'){ST.hp=MAXHP;ST.coffee=3;persist();sfx.save();say(['* A save node hums. Your signal steadies.','* HP restored. Coffee refilled (3). Progress saved.']);return}
  if(e.t==='stone'){const d=e.idea;say(['* A memory node glows. It holds a lecture she once gave.',`* ${d.t}.`,'* '+d.b,'* Example: '+d.ex],()=>unlock(e.key));return}

}

/* world update/draw */
function updWorld(dt){
  if(DLG){updDialog(dt);return}
  if(take('c')){openCodex();return}
  let dx=(held.right?1:0)-(held.left?1:0),dy=(held.down?1:0)-(held.up?1:0);
  if(dx||dy){const l=Math.hypot(dx,dy),sp=2.5*dt;const nx=PL.x+dx/l*sp,ny=PL.y+dy/l*sp;if(!blocked(nx,PL.y))PL.x=nx;if(!blocked(PL.x,ny))PL.y=ny;
    PL.face=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');PL.trail.push([PL.x,PL.y]);if(PL.trail.length>14)PL.trail.shift()}
  else if(PL.trail.length)PL.trail.shift();
  if(PL.x<4&&R.i>0){fadeThen(()=>enterRoom(R.i-1,'right'));PL.x=6}
  if(PL.x>CW-4&&R.i<ROOMS.length-1){fadeThen(()=>enterRoom(R.i+1,'left'));PL.x=CW-6}
  if(take('a')){const e=nearEnt();if(e)interact(e)}
}
function drawFloorAndWalls(t){

  for(const[x,y]of R.stars){g.fillStyle=yc(.08);g.beginPath();g.arc(x,y,2,0,6.283);g.fill()}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=c*TS,y=OY+r*TS;
    if(R.map[r][c]){g.fillStyle=yc(.035);g.fillRect(x,y,TS,TS);g.strokeStyle=yc(.5);g.lineWidth=1.2;g.beginPath();
      if(r>0&&!R.map[r-1][c]){g.moveTo(x,y+.5);g.lineTo(x+TS,y+.5)}if(r<ROWS-1&&!R.map[r+1][c]){g.moveTo(x,y+TS-.5);g.lineTo(x+TS,y+TS-.5)}

/* battle */
function startBattle(e){

/* ---------- background: grain, brain, network ---------- */
(function(){
  // grain tile
  const g=document.createElement('canvas');g.width=g.height=220;const gx=g.getContext('2d'),id=gx.createImageData(220,220);
  for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.random()<.5?255:120}
  gx.putImageData(id,0,0);document.getElementById('grain').style.backgroundImage=`url(${g.toDataURL()})`;

  const cv=document.getElementById('bg'),ctx=cv.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1;const BONE='236,231,220';

  // brain point cloud: two folded hemispheres, cerebellum, brainstem
  const P=[];const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const fold=(x,y,z)=>{const wx=x+.12*Math.sin(7.1*z+2.3*y),wy=y+.12*Math.sin(6.3*x+1.7*z),wz=z+.12*Math.sin(5.7*y+2.9*x);return Math.sin(15.5*wx+3*Math.sin(9*wz+1.1))+Math.sin(14.2*wy+3*Math.sin(10.4*wx+.7))+Math.sin(13.6*wz+3*Math.sin(9.6*wy+2.3))};
  let tries=0;
  while(P.length<15000&&tries<900000){tries++;const s=Math.random()<.5?-1:1;let ux=gauss(),uy=gauss(),uz=gauss();const L=Math.hypot(ux,uy,uz);ux/=L;uy/=L;uz/=L;
    if(ux*s<-.32)continue;let x=ux*.31,y=uy*.5,z=uz*.72;if(y<0)y*=.62;x*=1-.12*(z/.72);
    if(uy<-.1&&uz>-.15&&uz<.55)x*=1.08;const X=s*.31+x;const f=fold(X,y,z);
    if(Math.abs(f)<.16)P.push([X,y,z,1]);else if(Math.random()<.02)P.push([X,y,z,.35])}
  let cb=0;tries=0;while(cb<1500&&tries<100000){tries++;const s=Math.random()<.5?-1:1;let ux=gauss(),uy=gauss(),uz=gauss();const L=Math.hypot(ux,uy,uz);ux/=L;uy/=L;uz/=L;
    const x=s*.16+ux*.19,y=-.37+uy*.14,z=-.5+uz*.19;if(Math.abs(Math.sin(44*y+3.5*Math.sin(6*x)))<.32){P.push([x,y,z,.85]);cb++}}
  for(let i=0;i<380;i++){const t=Math.random(),a=Math.random()*Math.PI*2,r=.085-.02*t;P.push([Math.cos(a)*r,-.28-.46*t,-.2-.1*t+Math.sin(a)*r,.6])}
  const glow=new Float32Array(P.length);const waves=[];

  // network
  let layers=[];const signals=[];
  function layout(){const spec=W<720*dpr?[3,5,6,5,3]:[4,7,9,9,7,4];layers=spec.map((n,li)=>{const x=W*(.07+.86*li/(spec.length-1));const span=Math.min(H*.66,n*Math.min(H*.09,74*dpr));
    return[...Array(n)].map((_,k)=>({x,y:H*.52+(n===1?0:span*(k/(n-1)-.5)),ph:Math.random()*6.28,fl:0}))})}
  function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=cv.width=Math.round(innerWidth*dpr);H=cv.height=Math.round(innerHeight*dpr);layout();if(reduce)draw(0)}
  addEventListener('resize',resize);

  function spawn(li,ni){if(li>=layers.length-1)return;const nx=layers[li+1];signals.push({li,a:ni,b:Math.floor(Math.random()*nx.length),t:0,sp:.006+Math.random()*.008})}
  window.bgFire=function(strength){const n=Math.round(4+strength*6);for(let i=0;i<n;i++)spawn(0,Math.floor(Math.random()*layers[0].length));
    const o=P[Math.floor(Math.random()*P.length)];waves.push({o,t0:performance.now(),amp:Math.min(1,.45+strength*.25)});if(strength>=2)waves.push({o:P[Math.floor(Math.random()*P.length)],t0:performance.now()+250,amp:.8});if(reduce)draw(performance.now())};

  const pos=(n,t)=>[n.x,n.y+Math.sin(t*.0006+n.ph)*5*dpr];
  let lastSpawn=0,lastWave=0;
  function draw(t){
    ctx.clearRect(0,0,W,H);
    // brain
    const S=Math.min(W,H)*.48,cx=W*.5,cy=H*.47,yaw=1.5708+.6*Math.sin(t*.00011),pitch=-.22,cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),breathe=1+Math.sin(t*.0009)*.012;
    const now=performance.now();
    for(let w=waves.length-1;w>=0;w--){if(now-waves[w].t0>2600)waves.splice(w,1)}
    const B=[[],[],[],[],[],[],[],[]];const sz=1.1*dpr;
    for(let i=0;i<P.length;i++){const[x,y,z,wt]=P[i];
      let gl=0;for(const wv of waves){const age=(now-wv.t0)/1000;if(age<0)continue;const d=Math.hypot(x-wv.o[0],y-wv.o[1],z-wv.o[2]);const rr=age*.75;const k=(d-rr)/.07;gl+=wv.amp*Math.exp(-k*k)*(1-age/2.6)}
      const x1=x*cyw+z*syw,z1=-x*syw+z*cyw,y2=y*cp-z1*sp,z2=y*sp+z1*cp;const pr=3.2/(3.2+z2);
      const depth=Math.max(0,Math.min(1,.5-z2*.6));let a=(.07+.3*depth)*wt+gl*.6;const b=Math.max(0,Math.min(7,Math.floor(a*14)));

    for(let b=0;b<8;b++){const arr=B[b];if(!arr.length)continue;ctx.fillStyle=`rgba(${BONE},${(b+.5)/14})`;ctx.beginPath();for(let i=0;i<arr.length;i+=3){const s=sz*arr[i+2];ctx.rect(arr[i]-s/2,arr[i+1]-s/2,s,s)}ctx.fill()}

    // network edges
    ctx.lineWidth=dpr*.8;ctx.strokeStyle=`rgba(${BONE},.05)`;ctx.beginPath();
    for(let li=0;li<layers.length-1;li++)for(const a of layers[li])for(const b of layers[li+1]){const p=pos(a,t),q=pos(b,t);ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1])}ctx.stroke();
    // signals
    if(!reduce&&t-lastSpawn>420){lastSpawn=t;spawn(0,Math.floor(Math.random()*layers[0].length))}
    if(!reduce&&t-lastWave>4200){lastWave=t;waves.push({o:P[Math.floor(Math.random()*P.length)],t0:now,amp:.35})}
    for(let i=signals.length-1;i>=0;i--){const s=signals[i];s.t+=reduce?1:s.sp*1.6;const A=layers[s.li]?.[s.a],Bn=layers[s.li+1]?.[s.b];if(!A||!Bn){signals.splice(i,1);continue}const p=pos(A,t),q=pos(Bn,t);
      if(s.t>=1){Bn.fl=1;signals.splice(i,1);if(Math.random()<.82)spawn(s.li+1,s.b);if(Math.random()<.25)spawn(s.li+1,s.b);continue}
      const x=p[0]+(q[0]-p[0])*s.t,y=p[1]+(q[1]-p[1])*s.t,tx=p[0]+(q[0]-p[0])*Math.max(0,s.t-.12),ty=p[1]+(q[1]-p[1])*Math.max(0,s.t-.12);
      const gr=ctx.createLinearGradient(tx,ty,x,y);gr.addColorStop(0,`rgba(${BONE},0)`);gr.addColorStop(1,`rgba(${BONE},.55)`);ctx.strokeStyle=gr;ctx.lineWidth=1.4*dpr;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(x,y);ctx.stroke();
      ctx.fillStyle=`rgba(${BONE},.8)`;ctx.beginPath();ctx.arc(x,y,1.7*dpr,0,6.283);ctx.fill()}
    if(signals.length>140)signals.splice(0,signals.length-140);
    // nodes
    for(const L of layers)for(const n of L){const[x,y]=pos(n,t);const r=(3.4+n.fl*2.2)*dpr;
      if(n.fl>.02){ctx.fillStyle=`rgba(${BONE},${n.fl*.12})`;ctx.beginPath();ctx.arc(x,y,r*3.2,0,6.283);ctx.fill()}
      ctx.fillStyle=`rgba(${BONE},${.06+n.fl*.5})`;ctx.strokeStyle=`rgba(${BONE},${.3+n.fl*.4})`;ctx.lineWidth=dpr;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.stroke();n.fl*=.94}
  }
  function loop(t){draw(t);requestAnimationFrame(loop)}
  resize();if(reduce)draw(0);else requestAnimationFrame(loop);
})();
