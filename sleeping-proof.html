{id:'logic',name:'Prefrontal Cortex',sub:'the hall of mirrors',topic:'logic',variant:0,
 intro:['* The prefrontal cortex. Here she planned, judged, and decided.','* Every wall is a mirror. Every reflection is slightly wrong.'],
 npcs:[
  {sym:'⊤',name:'Tautology',lines:['Tautology: Hello! I am true. I am always true. Whatever p and q are doing, I am true.','Tautology: I am p ∨ ¬p. Some call that boring. I call it reliable.','Tautology: My cousin Contradiction is p ∧ ¬p. Always false. We don’t speak.','Tautology: Everyone else is a contingency: true in some rows of the truth table and false in others.','Tautology: A formula is satisfiable if at least one row makes it true. So everything except a contradiction is satisfiable.','Tautology: Two formulas are equivalent when they agree in every row. Put another way: A ≡ B exactly when A ↔ B is a tautology.','Tautology: With n variables the table has 2ⁿ rows. Ten variables is 1024 rows. That is why you learn the laws instead of always drawing tables.'],
   codex:[{t:'Tautology, contradiction, contingency',b:'Tautology: true in every row (p ∨ ¬p). Contradiction: false in every row (p ∧ ¬p). Contingency: neither. Satisfiable: true in at least one row. A ≡ B exactly when A ↔ B is a tautology. n variables give 2ⁿ rows.'}]},
  {sym:'∀∃',name:'The Quantifier Twins',lines:['∀: We are the quantifiers. I say “for all.”','∃: I say “there exists.” I only need one!','∀: To prove me, take an ARBITRARY element and show it works. You don’t get to pick a friendly one.','∃: To prove me, show a witness. One example is enough!','∀: To disprove me, give one counterexample. To disprove ∃, you must show nothing works, and that is a ∀.','∃: When you negate us, we swap and the negation moves inward: ¬∀x P(x) ≡ ∃x ¬P(x), and ¬∃x P(x) ≡ ∀x ¬P(x).','∀: Order matters. ∀x ∃y (y > x) is true on the integers. ∃y ∀x (y > x) is false. In the first one, y may depend on x.','∃: And watch the domain. ∃x (x² = 2) is false over ℚ and true over ℝ.','∀: One more. “All unicorns can fly” is TRUE. Vacuously. There are no unicorns to fail.','∃: He loves that one.'],
   codex:[{t:'Quantifiers in practice',b:'Prove ∀ with an arbitrary element; prove ∃ with a witness. Disprove ∀ with one counterexample. Negation swaps the quantifier: ¬∀x P ≡ ∃x ¬P. Order matters (∀x∃y vs ∃y∀x). The domain changes truth (x² = 2 over ℚ vs ℝ). A universal claim about an empty set is vacuously true.'}]}],
 journal:['* A page torn along one edge.','* “Found it. Lemma 7 says: if a graph is sparse-enough, it has property K. In Chapter 3 I wrote: it has property K, therefore it is sparse-enough. I used the converse. Six years ago. Nobody noticed. I didn’t either. — E.”'],
 boss:{id:'converse',name:'The Converse',sym:'⇄',mirror:true,orbit:6,need:4,pat:['rain','sweep'],glyphs:['¬','∧','∨','→','↔'],
  pre:['The Converse: Ah, a visitor! Let me reason about you.','The Converse: If something is a thought, it moves. You move. Therefore you are a thought!','The Converse: ...that one happens to be true. But my method is flawless!','The Converse: If she is a real mathematician, her proofs work. Her proof didn’t work... no, wait. Her proof... it’s all backwards in here.','The Converse: Reason with me. Help me read the mirror.'],
  intro:['* The Converse reflects everything you say. Backwards.'],
  asks:['The Converse: Hint? If p → q, then ¬q → ¬p is the same promise. q → p is a different promise.','The Converse: Hint? An implication only breaks when the front is true and the back is false.','The Converse: Hint? To negate “for all”, you only need one exception.','The Converse: Hint? De Morgan: negating “and” gives “or”, and negating “or” gives “and”.'],
  right:['The Converse: Oh. Oh, that’s the right direction.','The Converse: My reflection blinked first.','The Converse: Forwards... it reads better forwards.'],
  wrong:['The Converse: Ha! You see it my way!','The Converse: Mirror, mirror...'],
  notyet:'The Converse: Spare me? I still believe q gives me p!',
  spare:['The Converse: So p → q, and q... tells me nothing about p.','The Converse: Then she didn’t fail because she isn’t a mathematician. She failed because she read one lemma backwards.','The Converse: That is a mistake. Mistakes have a direction. They can be walked back.','* You spared The Converse. A mirror cracks and lets the light through.'],
  post:['The Converse: I read everything forwards now. It’s slower. It’s correct.']}
},

{id:'proofs',name:'Hippocampus',sub:'the archive',topic:'proofs',variant:1,
 intro:['* The hippocampus: where memories are filed.','* Shelves of examples stretch out of sight. Every one is stamped VERIFIED.'],
 npcs:[
  {sym:'⊥',name:'Contra',lines:['Contra: I am Contra. My method looks dramatic, but it is simple.','Contra: To prove S, assume ¬S. Reason until you reach something impossible: a statement and its negation, together.','Contra: True premises can’t lead to a falsehood. So the assumption ¬S was wrong, and S holds.','Contra: People confuse me with my sibling, Contraposition. To prove P → Q, Contraposition proves ¬Q → ¬P directly. No contradiction needed.','Contra: Rule of thumb: try a direct proof first. Use contraposition when ¬Q is easier to work with. Call me when the claim says “not”, “no”, or “infinitely many”.','Contra: √2 is irrational? That’s a “not”. Infinitely many primes? Assume finitely many and build N = p₁p₂⋯pₙ + 1. You see the pattern.'],
   codex:[{t:'Contradiction vs contraposition',b:'Contradiction: assume ¬S, derive an impossibility, conclude S. Contraposition: prove P → Q by proving ¬Q → ¬P directly. Try direct proof first; contraposition when ¬Q is concrete; contradiction for “not”, “no”, “infinitely many” (√2 irrational, infinitely many primes).'}]},
  {sym:'∨',name:'Casey',lines:['Casey: Cases! Split the world into pieces you can handle, and handle every piece.','Casey: The pieces must be exhaustive. Even or odd. Positive, zero, or negative. Miss one and the proof has a hole.','Casey: When cases are symmetric, write “without loss of generality, assume x ≤ y” and do just one.','Casey: My friend the Pigeon says: put n + 1 letters in n mailboxes and some box gets two. More generally, N things in k boxes puts at least ⌈N/k⌉ in one box.','Casey: Simple, but it proves surprising things. In any group of 6 people, there are 3 mutual friends or 3 mutual strangers. That’s Ramsey’s R(3,3) = 6, proved with pigeons and cases.'],
   codex:[{t:'Cases, WLOG, pigeonhole',b:'Proof by cases needs an exhaustive split. WLOG skips symmetric cases. Pigeonhole: n + 1 objects in n boxes share a box; N objects in k boxes put at least ⌈N/k⌉ in one. Example: R(3,3) = 6.'}]},
  {sym:'#',name:'The Archivist',lines:['The Archivist: Want a warning from the stacks?','The Archivist: In 1919 George Pólya conjectured something about how many prime factors numbers have. It was checked for millions of numbers.','The Archivist: In 1958 a counterexample was proved to exist. The smallest one is 906,150,257.','The Archivist: Euler conjectured you need at least n nth powers to sum to an nth power. In 1966 a computer found 27⁵ + 84⁵ + 110⁵ + 133⁵ = 144⁵.','The Archivist: Examples are wonderful for guessing. They prove nothing about “for all”.','The Archivist: But one counterexample is a complete proof that a “for all” is false. Remember that. It matters here.'],
   codex:[{t:'Why examples are not proofs',b:'Pólya’s conjecture held for every n below 906,150,257, then failed. Euler’s sum-of-powers conjecture fell to 27⁵ + 84⁵ + 110⁵ + 133⁵ = 144⁵. Checking cases suggests; only proof establishes. One counterexample fully disproves a universal claim.'}]}],
 journal:['* The ink is smudged, as if it got wet.','* “Tomas emailed at 3 a.m. A single number, twelve digits long. My conjecture fails there. We had checked up to a billion. He apologized four times in one email. I didn’t reply. — E.”'],
 boss:{id:'anecdote',name:'Anecdote',sym:'✓',orbit:9,need:4,pat:['aimed','rain'],glyphs:['✓','∴','∵','✓'],
  pre:['Anecdote: Welcome to my archive! Ten thousand examples, every one verified!','Anecdote: n² + n + 41 is prime for n = 0, 1, 2, all the way to 39! Forty examples! Surely it’s ALWAYS prime!','Anecdote: (Don’t check n = 40. Please don’t check n = 40.)','Anecdote: She checked a billion cases. A BILLION. How can a billion examples be wrong?'],
  intro:['* Anecdote shuffles a stack of examples, very fast.'],
  asks:['Anecdote: Hint? A universal claim needs a proof that covers an arbitrary case.','Anecdote: Hint? One counterexample beats a billion examples.','Anecdote: Hint? Pick the method that fits the shape of the claim: direct, contrapositive, contradiction, cases.'],
  right:['Anecdote: ...that’s a proof. Not a pile. A proof.','Anecdote: One shelf just got lighter.','Anecdote: Fine. FINE. n = 40 gives 1681 = 41². Not prime.'],
  wrong:['Anecdote: See? Another example for my collection!','Anecdote: Verified! (Probably.)'],
  notyet:'Anecdote: You can’t spare me yet. I have 9,999 more examples.',
  spare:['Anecdote: So a billion examples was never a proof. And one counterexample is.','Anecdote: Then Tomas’s number isn’t an insult. It’s a theorem: “there exists an n where the conjecture fails.” It is TRUE, and it is PROVED.','Anecdote: She should have read that email as a gift.','* You spared Anecdote. The shelves quietly relabel themselves: EVIDENCE, not PROOF.'],
  post:['Anecdote: I’m keeping the examples. They’re good for guessing.']}
},

{id:'sets',name:'Temporal Lobe',sub:'the library of collections',topic:'sets',variant:2,
 intro:['* The temporal lobe. Names, categories, the sorting of things into kinds.','* Boxes inside boxes inside boxes. One box is labelled “all boxes that don’t contain themselves.” It is shaking.'],
 npcs:[
  {sym:'∅',name:'Empty',lines:['∅: Hi. I’m the empty set. I contain nothing. People think that makes me nothing. It doesn’t.','∅: I’m a subset of every set. To be a subset of A, every element of me must be in A. I have no elements, so I pass every test.','∅: But I’m not an element of every set. ∅ ⊆ {1, 2} is true. ∅ ∈ {1, 2} is false.','∅: And {∅} is not me. It’s a box holding an empty box. It has one element.','∅: You can build all the natural numbers from me: 0 = ∅, 1 = {∅}, 2 = {∅, {∅}}, and n + 1 = n ∪ {n}. Von Neumann did.','∅: Not bad for nothing.'],
   codex:[{t:'The empty set',b:'∅ ⊆ A for every A (vacuously), but ∅ ∈ A only if listed. {∅} ≠ ∅: it has one element. |P(∅)| = 1. Von Neumann naturals: 0 = ∅, 1 = {∅}, 2 = {∅, {∅}}, n + 1 = n ∪ {n}.'}]},
  {sym:'∞',name:'Hilbert',lines:['Hilbert: Welcome to my hotel. Infinitely many rooms, every one occupied.','Hilbert: A new guest? Everyone moves from room n to room n + 1. Room 1 is free.','Hilbert: Infinitely many new guests? Everyone moves to room 2n. All the odd rooms are free.','Hilbert: Two sets have the same size when there is a bijection between them. ℕ, ℤ and even ℚ are the same size. We call them countable.','Hilbert: But a coach of guests, one for every infinite string of 0s and 1s? I cannot fit them. Cantor showed why.','Hilbert: Suppose you had a list. Build a new string by flipping the nth digit of the nth guest. It differs from everyone on the list. So no list works.','Hilbert: That’s the diagonal argument. P(ℕ) and ℝ are uncountable. And Cantor’s theorem says |P(A)| > |A| for every set: there is no biggest infinity.'],
   codex:[{t:'Countable and uncountable',b:'Same size means a bijection exists. ℕ, ℤ, ℚ, ℕ × ℕ are countable (Hilbert’s hotel shifts n ↦ n + 1, n ↦ 2n). Diagonal argument: any list of infinite binary strings misses the string flipping each nth digit of the nth entry, so P(ℕ) and ℝ are uncountable. Cantor: |P(A)| > |A| always.'}]}],
 journal:['* The page has been folded and unfolded many times.','* “I keep asking whether I can trust the mind that made the mistake. But it is the only mind I have to check the mistake with. Is that circular? — E.”'],
 boss:{id:'russell',name:'Russell’s Set',sym:'∈',flicker:['∈','∉'],orbit:7,need:4,pat:['bounce','ring'],glyphs:['∈','∉','⊆','∅','∪','∩'],
  pre:['Russell’s Set: Do I contain myself?','Russell’s Set: I am the set of all sets that do not contain themselves. If I contain myself, I shouldn’t. If I don’t, I should.','Russell’s Set: In. Out. In. Out. I flip forever.','Russell’s Set: She does it too. Can a mind that doubts itself trust its own doubt? In. Out.'],
  intro:['* Russell’s Set flickers between in and out.'],
  asks:['Russell’s Set: Hint? ∈ means “is an element of”. ⊆ means “every element is also in”.','Russell’s Set: Hint? A set with n elements has 2ⁿ subsets.','Russell’s Set: Hint? Two sets are equal when they have exactly the same elements.','Russell’s Set: Hint? Countable means you can list it, one by one, missing nothing.'],
  right:['Russell’s Set: ...that settled one flip.','Russell’s Set: In. Just in. For a moment it was quiet.','Russell’s Set: A definite answer. I’d forgotten what those feel like.'],
  wrong:['Russell’s Set: In! Out! In!','Russell’s Set: The paradox grows.'],
  notyet:'Russell’s Set: You can’t spare something that might not exist!',
  spare:['Russell’s Set: So the answer is... I’m not a set at all?','Russell’s Set: Not every description makes a set. Mathematicians fixed this with axioms: you may only carve a set out of a set you already have.','Russell’s Set: I was never a contradiction in the world. I was a badly asked question.','Russell’s Set: Maybe her doubt is like me. Not proof that she is broken. Just a question that needs better axioms.','* You spared Russell’s Set. It stops flickering and settles, gently, outside every box.'],
  post:['Russell’s Set: I live outside the library now. The view is lovely.']}
},

{id:'func',name:'Parietal Lobe',sub:'the switchyard',topic:'func',variant:0,
 intro:['* The parietal lobe. Where things are mapped onto other things: hands onto space, words onto meaning.','* Rails split and merge. Two tracks run into one and never come apart again.'],
 npcs:[
  {sym:'↔',name:'Pairing',lines:['Pairing: I match things up. One to one, nobody left out. That makes me a bijection.','Pairing: Injective means no two inputs share an output. Picture arrows: no two land on the same point.','Pairing: Surjective means every point of the codomain gets hit by some arrow.','Pairing: For finite sets of the same size, injective and surjective are the same thing. For infinite sets, no: n ↦ n + 1 on ℕ is injective but never hits 0.','Pairing: The image f(A) is everything that gets hit. The preimage f⁻¹(B) is everything that lands in B. Preimages exist even when no inverse does.','Pairing: Counting: from an m-set to an n-set there are nᵐ functions, and n!/(n − m)! of them are injective.'],
   codex:[{t:'Injections, surjections, images',b:'Injective: no shared outputs. Surjective: every codomain point hit. Bijective: both, so an inverse exists. Finite equal-size sets: injective ⇔ surjective; on ℕ, n ↦ n + 1 is injective, not surjective. Images and preimages exist for every function. nᵐ functions from an m-set to an n-set, n!/(n − m)! injective.'}]},
  {sym:'≤',name:'Order',lines:['Order: I arrange things. Not always in a line, though.','Order: A partial order is reflexive, antisymmetric and transitive. Like ⊆ on sets, or “divides” on positive integers.','Order: “Partial” means some pairs are incomparable. 2 doesn’t divide 3, and 3 doesn’t divide 2.','Order: If every pair is comparable, like ≤ on numbers, I’m a total order.','Order: Draw me as a Hasse diagram: bigger things higher, connect only covering pairs, leave out loops and anything transitivity implies.','Order: My cousin the equivalence relation is reflexive, symmetric and transitive. It doesn’t rank. It groups things into classes that never overlap.'],
   codex:[{t:'Partial orders and equivalence',b:'Partial order: reflexive, antisymmetric, transitive (⊆, divides). Some pairs may be incomparable; a total order has none. Hasse diagrams show only covering pairs. Equivalence relation: reflexive, symmetric, transitive; it partitions the set into disjoint classes.'}]}],
 journal:['* A conference program, with one line crossed out in pencil.','* “The conference website lists my talk as WITHDRAWN. A one-way function: talk ↦ withdrawn. I can’t find an inverse. — E.”'],
 boss:{id:'collision',name:'The Collision',sym:'⤨',orbit:8,need:4,pat:['sweep','aimed'],glyphs:['↦','→','∘','f'],
  pre:['The Collision: Two things came to me. I sent them both to the same place.','The Collision: Now when someone asks “where did this come from?”, I can’t answer. I’m not injective.','The Collision: I can never be undone. There is no f⁻¹ for me.','The Collision: She feels like me. Something happened that cannot be reversed.'],
  intro:['* Two tracks run into The Collision. Only one comes out.'],
  asks:['The Collision: Hint? Injective: f(a) = f(b) forces a = b.','The Collision: Hint? Surjective: everything in the codomain gets hit.','The Collision: Hint? An equivalence relation is reflexive, symmetric and transitive.','The Collision: Hint? A two-sided inverse needs a bijection.'],
  right:['The Collision: You understand the arrows.','The Collision: Something untangled.','The Collision: Yes. That is how mapping works.'],
  wrong:['The Collision: Another collision.','The Collision: Everything lands in the same place.'],
  notyet:'The Collision: Mercy? I can’t even undo myself.',
  spare:['The Collision: I can’t be inverted. But the things that collide in me form classes: a ~ b when f(a) = f(b).','The Collision: That’s an equivalence relation. And on those classes, I AM injective.','The Collision: I can’t be undone. But I can be understood. That is a different kind of inverse.','The Collision: A withdrawn talk can’t be un-withdrawn. She can still give the next one.','* You spared The Collision. The two tracks stay merged, and now they are labelled.'],
  post:['The Collision: Restrict my domain and I behave. x² on [0, ∞) has an inverse. Funny, that.']}
},

{id:'ind',name:'Cerebellum',sub:'the long stair',topic:'ind',variant:1,
 intro:['* The cerebellum. It learns by repetition: one step, then the next, until walking needs no thought.','* A staircase climbs forever. At the bottom stands a single domino. It refuses to fall.'],
 npcs:[
  {sym:'n',name:'Stairwright',lines:['Stairwright: I build stairs. Infinite ones. The trick is, I never build them all.','Stairwright: I build the first step. Then I prove that whenever step k exists, step k + 1 can be built on it.','Stairwright: That’s induction. Base case: P(n₀). Inductive step: P(k) → P(k + 1) for every k ≥ n₀.','Stairwright: Write it properly. “Assume P(k) for an arbitrary k ≥ n₀.” Then show exactly where you use it. If you never use it, it wasn’t induction.','Stairwright: Example: 3 divides n³ − n. Base: 0³ − 0 = 0. Step: (k + 1)³ − (k + 1) = (k³ − k) + 3k² + 3k. The first part is divisible by 3 by hypothesis, the rest plainly is.','Stairwright: The base isn’t always 0. 2ⁿ > n² fails for n = 2, 3, 4 and holds from n = 5 on. Choose your base carefully.'],
   codex:[{t:'Writing an induction proof',b:'State P(n). Prove the base P(n₀). Assume P(k) for arbitrary k ≥ n₀, prove P(k + 1), and point out where the hypothesis is used. Example: 3 | n³ − n since (k + 1)³ − (k + 1) = (k³ − k) + 3(k² + k). Bases matter: 2ⁿ > n² holds only from n = 5.'}]},
  {sym:'Fₙ',name:'Recursion',lines:['Recursion: Hello, hello, hello. I define things in terms of smaller versions of themselves.','Recursion: Fibonacci: F₀ = 0, F₁ = 1, Fₙ = Fₙ₋₁ + Fₙ₋₂. Two base cases, because each step looks two back.','Recursion: That’s why proofs about me use strong induction: you may assume every earlier case, not just the last.','Recursion: Strings, trees and formulas are recursive too. A binary tree is either empty, or a root with two binary subtrees.','Recursion: To prove things about them, use structural induction: prove it for the base objects, then show every construction rule preserves it.','Recursion: Recursion and induction are one idea seen from two sides. One builds. The other proves.'],
   codex:[{t:'Recursion and strong induction',b:'Recursive definitions build objects from smaller ones (Fibonacci needs two bases). Strong induction assumes all earlier cases. Structural induction proves a property for base objects and shows each constructor preserves it. Recursion builds; induction proves.'}]}],
 journal:['* A sticky note, stuck to nothing.','* “Students keep emailing. ‘One step at a time, Professor.’ I taught them that. I can’t take the first one. — E.”'],
 boss:{id:'domino',name:'Domino',sym:'▯',orbit:6,need:4,pat:['rain','bounce'],glyphs:['n','k','+1','∎'],
  pre:['Domino: Don’t push me.','Domino: If I fall, the next one falls, and the next, forever. Everything depends on me.','Domino: What if I’m wrong? What if the first step is the false one?','Domino: She hasn’t opened her notebook in months. If the first page is wrong, the whole book is wrong.'],
  intro:['* Domino stands very, very still.'],
  asks:['Domino: Hint? You need BOTH a base case and an inductive step.','Domino: Hint? Strong induction assumes every case up to k.','Domino: Hint? Check that the step really works even for the smallest k.'],
  right:['Domino: The base case... holds. I checked. It holds.','Domino: The step from me to the next one is sound.','Domino: I wobbled. On purpose.'],
  wrong:['Domino: See? Things go wrong!','Domino: I’m not moving.'],
  notyet:'Domino: Not yet. I need to check the base case again.',
  spare:['Domino: The base case is true. And whenever a domino falls, the next one falls.','Domino: Then I don’t have to be brave about all of them. Just about me. Just one step.','Domino: Here goes.','* The domino tips. The sound of falling dominoes goes on, up the stairs, for a very long time.','* You spared Domino.'],
  post:['Domino: I’m lying down now. It’s very restful being a completed proof.']}
},

{id:'num',name:'Basal Ganglia',sub:'the clockworks',topic:'num',variant:2,
 intro:['* The basal ganglia: rhythm, habit, timing.','* Gears tick in perfect cycles. Every cycle leaves a little something left over.'],
 npcs:[
  {sym:'gcd',name:'Euclid',lines:['Euclid: Greetings. I am old. My algorithm is older than most of your languages.','Euclid: To find gcd(a, b): divide, keep the remainder, repeat. gcd(a, b) = gcd(b, a mod b). When the remainder hits 0, the last nonzero one is the answer.','Euclid: Why does it work? Anything dividing a and b also divides a − qb, the remainder. The common divisors never change.','Euclid: It is fast. The numbers at least halve every two steps.','Euclid: Run it backwards and you get Bézout: gcd(a, b) = ax + by for some integers x and y.','Euclid: From that comes my lemma: if a prime p divides ab, then p divides a or p divides b. That is why prime factorizations are unique.'],
   codex:[{t:'Euclid, Bézout, unique factorization',b:'gcd(a, b) = gcd(b, a mod b); stop at remainder 0. Divisors are preserved because d | a, d | b ⇒ d | a − qb. Back-substitution gives Bézout: gcd = ax + by. Euclid’s lemma: p | ab ⇒ p | a or p | b, which gives unique prime factorization.'}]},
  {sym:'mod',name:'The Clockmaker',lines:['The Clockmaker: On my clocks, 9 + 5 = 2. That’s arithmetic mod 12.','The Clockmaker: a ≡ b (mod n) means n divides a − b. Add, subtract, multiply, and reduce whenever you like.','The Clockmaker: Division is trickier. a has an inverse mod n exactly when gcd(a, n) = 1. Find it with extended Euclid.','The Clockmaker: Mod a prime p, every nonzero number has an inverse, and Fermat says aᵖ⁻¹ ≡ 1. For any n, Euler says a^φ(n) ≡ 1 when gcd(a, n) = 1.','The Clockmaker: For big powers, square repeatedly. 3⁶⁴ is six squarings, not sixty-three multiplications.','The Clockmaker: RSA: pick primes p and q, publish n = pq and e, keep d with ed ≡ 1 mod φ(n). Encrypt with mᵉ, decrypt with cᵈ. Without p and q, nobody can find φ(n).'],
   codex:[{t:'Modular arithmetic and RSA',b:'a ≡ b (mod n) ⇔ n | a − b. Add and multiply freely; an inverse exists iff gcd(a, n) = 1. Fermat: aᵖ⁻¹ ≡ 1 (mod p). Euler: a^φ(n) ≡ 1. Fast exponentiation by repeated squaring. RSA: n = pq public, ed ≡ 1 mod φ(n), encrypt mᵉ, decrypt cᵈ.'}]}],
 journal:['* Written on the back of a seminar flyer.','* “Tomas told me once he never felt he belonged in my group. Everyone else divided evenly into the work, he said. He was the remainder. He found the counterexample alone, on a Sunday. — E.”'],
 boss:{id:'remainder',name:'The Remainder',sym:'r',lone:true,orbit:6,need:4,pat:['ring','sweep'],glyphs:['0','1','2','3','7','≡'],
  pre:['The Remainder: Everyone divides evenly. Everyone except me.','The Remainder: I’m what is left over. The part that doesn’t fit.','The Remainder: Nobody wants a remainder. They round me off.'],
  intro:['* The Remainder sits a little apart from everything else.'],
  asks:['The Remainder: Hint? a = qn + r with 0 ≤ r < n. I’m r.','The Remainder: Hint? An inverse mod n exists exactly when gcd(a, n) = 1.','The Remainder: Hint? Reduce at every step. You never need the huge number.','The Remainder: Hint? Fermat: aᵖ⁻¹ ≡ 1 mod a prime p, if p doesn’t divide a.'],
  right:['The Remainder: ...you used me. Just me. Not the quotient.','The Remainder: That whole answer was built from remainders.','The Remainder: I mattered there.'],
  wrong:['The Remainder: Rounded off again.','The Remainder: Nobody counts the leftovers.'],
  notyet:'The Remainder: Spare me? You haven’t even used me yet.',
  spare:['The Remainder: Wait. All of modular arithmetic is remainders. Clocks. Calendars. Cryptography.','The Remainder: The quotient says how many times something fit. The remainder says what is special about it.','The Remainder: Tomas was the remainder. That’s why he saw what the rest of them couldn’t.','* You spared The Remainder. Somewhere, a lock clicks open.'],
  post:['The Remainder: 17 mod 5 is 2. I’m the 2. I’m proud of it.']}
},

{id:'count',name:'Occipital Lobe',sub:'the abacus fields',topic:'count',variant:0,
 intro:['* The occipital lobe, where she learned to see patterns.','* Fields of abacus beads in every direction. Something has been counting them, and counting them again.'],
 npcs:[
  {sym:'C',name:'Choosy',lines:['Choosy: Before you count anything, ask two questions. Does order matter? Are repeats allowed?','Choosy: Order matters, repeats allowed: nᵏ. Passwords.','Choosy: Order matters, no repeats: n!/(n − k)!. Podium finishes.','Choosy: Order doesn’t matter, no repeats: C(n, k) = n!/(k!(n − k)!). Committees.','Choosy: Order doesn’t matter, repeats allowed: C(n + k − 1, k). Donuts. Stars and bars.','Choosy: Stuck? Count the ordered version, then divide by how many times each answer got counted.'],
   codex:[{t:'The four counting cases',b:'Ordered with repeats: nᵏ. Ordered without repeats: n!/(n − k)!. Unordered without repeats: C(n, k). Unordered with repeats: C(n + k − 1, k). When unsure, count ordered and divide by the overcount.'}]},
  {sym:'△',name:'Pascal',lines:['Pascal: My triangle! Each entry is the sum of the two above it: C(n, k) = C(n − 1, k − 1) + C(n − 1, k).','Pascal: Why? A chosen subset either contains a special element or it doesn’t. That’s a combinatorial proof: count one thing two ways.','Pascal: Row n sums to 2ⁿ: every subset of an n-set. And C(n, k) = C(n, n − k): choosing what to take is choosing what to leave.','Pascal: The binomial theorem: (x + y)ⁿ = Σ C(n, k) xᵏ yⁿ⁻ᵏ.','Pascal: For overlaps, inclusion–exclusion: |A ∪ B ∪ C| = |A| + |B| + |C| − |A ∩ B| − |A ∩ C| − |B ∩ C| + |A ∩ B ∩ C|.','Pascal: Add the singles, subtract the pairs, add the triples. Keep alternating.'],
   codex:[{t:'Pascal, binomials, inclusion–exclusion',b:'C(n, k) = C(n − 1, k − 1) + C(n − 1, k). Rows sum to 2ⁿ. C(n, k) = C(n, n − k). (x + y)ⁿ = Σ C(n, k)xᵏyⁿ⁻ᵏ. Combinatorial proof: count one set two ways. Inclusion–exclusion alternates singles, pairs, triples…'}]}],
 journal:['* A long list, in very small handwriting. Most lines are crossed out.','* “I made a list of everything I got wrong. 47 items. Then I noticed: it was one mistake, counted in every chapter it touched. — E.”'],
 boss:{id:'overcount',name:'Overcount',sym:'#',ghost:true,orbit:8,need:4,pat:['rain','ring'],glyphs:['C','!','Σ','×'],
  pre:['Overcount: Failures! Let me count them! One, two, two again, three, three again, three AGAIN...','Overcount: Forty-seven! Ninety-four! I count everything twice. Sometimes three times.','Overcount: Every chapter that used the bad lemma is another failure. Isn’t it?'],
  intro:['* Overcount is counting you. Twice.'],
  asks:['Overcount: Hint? Does order matter? Are repeats allowed?','Overcount: Hint? If everything got counted k times, divide by k.','Overcount: Hint? Overlaps get added twice, so subtract them once.'],
  right:['Overcount: ...I counted that once. Exactly once.','Overcount: Divide by the overcount. Huh.','Overcount: The number got smaller. And truer.'],
  wrong:['Overcount: More! Count it again!','Overcount: Double it!'],
  notyet:'Overcount: Spare me? Let me count the reasons not to. One, one, one...',
  spare:['Overcount: So when the same thing shows up in many places, you count it once and subtract the overlaps.','Overcount: Forty-seven entries. One mistake. One lemma read backwards.','Overcount: One is a very fixable number.','* You spared Overcount. The beads settle into one neat row.'],
  post:['Overcount: I counted the stars. Once each. It took ages. It was lovely.']}
},

{id:'prob',name:'Amygdala',sub:'the house of chance',topic:'prob',variant:1,
 intro:['* The amygdala: fear, hope, the feeling in your gut before a decision.','* Dice roll on every table. A wheel spins and spins. Someone is very sure their luck is about to change.'],
 npcs:[
  {sym:'P(|)',name:'Bayes',lines:['Bayes: Hoo. Let me tell you about tests.','Bayes: A disease affects 1 person in 1000. A test catches it 99% of the time, and wrongly flags 1% of healthy people.','Bayes: You test positive. What’s the chance you’re sick? Most people say 99%. It’s about 9%.','Bayes: Picture 100,000 people. 100 are sick, and 99 of them test positive. 99,900 are healthy, and 999 of them test positive too. 99 out of 1098 is about 9%.','Bayes: That’s my rule: P(A | B) = P(B | A) P(A) / P(B). The base rate P(A) matters enormously.','Bayes: And conditional probability, P(A | B) = P(A ∩ B)/P(B), just means: shrink the world to B, then measure A inside it.'],
   codex:[{t:'Conditioning and Bayes',b:'P(A | B) = P(A ∩ B)/P(B): restrict the sample space to B. Bayes: P(A | B) = P(B | A)P(A)/P(B). Base rates dominate: at 1/1000 prevalence, a test with 99% sensitivity and 1% false positives gives only about a 9% chance of disease after a positive result.'}]},
  {sym:'E',name:'Expectation',lines:['Expectation: I’m the average you’d get if you repeated something forever.','Expectation: E[X] = Σ x · P(X = x). For a die, (1 + 2 + ⋯ + 6)/6 = 3.5. You can’t roll it. It’s still the right average.','Expectation: My superpower is linearity: E[X + Y] = E[X] + E[Y], even when X and Y depend on each other.','Expectation: Trick: write a count as a sum of indicators. n people grab hats at random. Expected number who get their own? Each does with probability 1/n, so 1 in total.','Expectation: Spread is variance: Var(X) = E[X²] − E[X]². Variances of independent variables add.','Expectation: Markov: P(X ≥ a) ≤ E[X]/a for X ≥ 0. Chebyshev: P(|X − μ| ≥ kσ) ≤ 1/k². Averages of many trials concentrate: the law of large numbers.'],
   codex:[{t:'Expectation, variance, bounds',b:'E[X] = Σ x P(X = x). Linearity holds without independence; use indicator variables (expected fixed points of a random permutation = 1). Var(X) = E[X²] − E[X]², additive when independent. Markov: P(X ≥ a) ≤ E[X]/a. Chebyshev: P(|X − μ| ≥ kσ) ≤ 1/k². Law of large numbers.'}]}],
 journal:['* A betting slip. On the back, a note.','* “Nineteen years without a breakthrough. I told myself I was due. As if the universe kept a ledger. — E.”'],
 boss:{id:'gambler',name:'The Gambler',sym:'½',dice:true,orbit:6,need:4,pat:['bounce','aimed'],glyphs:['½','⅙','P','E'],
  pre:['The Gambler: Twelve tails in a row, friend. Twelve! Heads is DUE.','The Gambler: The universe owes me. It owes HER. Nineteen years of tails.','The Gambler: One more spin and it all evens out. That’s how probability works, right?'],
  intro:['* The Gambler shuffles a deck with no aces in it.'],
  asks:['The Gambler: Hint? Independent events don’t remember each other.','The Gambler: Hint? Count outcomes in the event and divide by all outcomes.','The Gambler: Hint? Expectation adds up, even for dependent variables.'],
  right:['The Gambler: Huh. The dice don’t care about me?','The Gambler: That’s... annoyingly correct.','The Gambler: The wheel slowed down a little.'],
  wrong:['The Gambler: Double or nothing!','The Gambler: Heads is due, I tell you!'],
  notyet:'The Gambler: Mercy? Let me win one first!',
  spare:['The Gambler: So the coin has no memory. The thirteenth flip is still one half.','The Gambler: Nobody is owed a breakthrough. But every honest attempt has a chance, and expectation adds up.','The Gambler: Keep flipping, and the expected number of heads grows with every flip. Not because you’re due. Because you kept going.','* You spared The Gambler. The wheel stops. It lands on nothing in particular, and that’s fine.'],
  post:['The Gambler: I’ve taken up statistics. Less exciting. More winning.']}
},

{id:'graph',name:'Corpus Callosum',sub:'the bridges',topic:'graph',variant:2,
 intro:['* The corpus callosum: two hundred million fibres joining the left of the mind to the right.','* A city of islands and bridges. A keeper stands at the last bridge, arms folded.'],
 npcs:[
  {sym:'χ',name:'The Colourist',lines:['The Colourist: I paint vertices. One rule: no edge may join two of the same colour.','The Colourist: The fewest colours you need is the chromatic number, χ(G). A triangle needs 3. An even cycle needs only 2.','The Colourist: χ(G) ≤ 2 exactly when G is bipartite, which happens exactly when G has no odd cycle.','The Colourist: Greedy colouring never uses more than Δ + 1 colours, where Δ is the largest degree.','The Colourist: Every planar map needs at most 4 colours. That theorem needed a computer, in 1976.','The Colourist: Colouring is everywhere: exam timetables, register allocation, radio frequencies. Conflicts are edges. Colours are resources.'],
   codex:[{t:'Graph colouring',b:'χ(G) is the fewest colours with no monochromatic edge. χ ≤ 2 ⇔ bipartite ⇔ no odd cycle. Greedy uses ≤ Δ + 1. Four Colour Theorem (1976): planar graphs need ≤ 4. Uses: scheduling, register allocation, frequency assignment.'}]},
  {sym:'T',name:'Tree',lines:['Tree: I’m connected and I have no cycles. That’s all a tree is.','Tree: With n vertices I have exactly n − 1 edges. Add one more and you make a cycle. Take one away and I fall apart.','Tree: Between any two of my vertices there is exactly one path.','Tree: Every connected graph contains a spanning tree: a tree that reaches every vertex using only the graph’s edges.','Tree: With weights, Kruskal’s algorithm builds the cheapest one: add the lightest edge that makes no cycle, and repeat.','Tree: And my friend Dijkstra finds shortest paths from one source, as long as no edge weight is negative.'],
   codex:[{t:'Trees, spanning trees, paths',b:'A tree is connected and acyclic; n vertices ⇒ n − 1 edges; exactly one path between any two vertices. Every connected graph has a spanning tree. Kruskal builds a minimum spanning tree greedily. Dijkstra finds shortest paths when weights are nonnegative.'}]}],

  if(i>0)for(const r of[6,7,8])map[r][0]=0;if(i<ROOMS.length-1)for(const r of[6,7,8])map[r][COLS-1]=0;

  const lines=wrap(text,'16px '+MONO,maxW);for(let i=0;i<lines.length;i+=per)pages.push({who,lines:lines.slice(i,i+per),len:lines.slice(i,i+per).join('').length})}return pages}

    else if(ph==='menu'){g.font='16px '+MONO;g.fillStyle=yc(1);const lines=wrap(B.ready?`* ${B.def.name} is ready to be spared.`:`* ${B.def.name} is waiting. Understanding: ${B.resolve} of ${B.need}.`,'16px '+MONO,548);lines.forEach((l,k)=>g.fillText(l,44,282+k*25))}}
  // HP + menu
  g.font='13px '+MONO;g.fillStyle=yc(1);g.fillText('SPARK',32,423);g.fillText('HP',110,423);g.strokeStyle=yc(.7);g.lineWidth=1;g.strokeRect(134,412,100,13);g.fillStyle=yc(.9);g.fillRect(136,414,96*ST.hp/MAXHP,9);g.fillStyle=yc(1);g.fillText(`${ST.hp}/${MAXHP}`,244,423);
  g.fillStyle=yc(.55);g.fillText(`coffee ${ST.coffee}`,320,423);
  const labels=['REASON','ASK','ITEM',B.ready?'MERCY ✦':'MERCY'];labels.forEach((l,k)=>{const x=24+k*150,y=434,w=138,h=36,sel=ph==='menu'&&B.menu===k;
    g.strokeStyle=k===3&&B.ready?GOOD:yc(sel?1:.55);g.lineWidth=sel?2:1.2;g.strokeRect(x+.5,y+.5,w,h);if(sel){g.fillStyle=yc(.1);g.fillRect(x+1,y+1,w-1,h-1)}
    g.font='14px '+MONO;g.fillStyle=k===3&&B.ready?GOOD:yc(sel?1:.7);g.textAlign='center';g.fillText(l,x+w/2+(sel?8:0),y+23);g.textAlign='left';if(sel)drawSoul(x+18,y+18,t)});
}
function drawSoul(x,y,t){g.fillStyle=yc(.25);g.beginPath();g.arc(x,y,9,0,6.283);g.fill();g.fillStyle=yc(1);g.beginPath();g.moveTo(x,y-6);g.lineTo(x+5,y);g.lineTo(x,y+6);g.lineTo(x-5,y);g.closePath();g.fill()}

/* title + ending */
function titleItems(){return hasSave&&ST.room>0||hasSave&&Object.keys(ST.codex).length?['Continue','Begin again']:['Begin']}
function updTitle(){const it=titleItems();if(take('up')||take('left')){S.menu=(S.menu+it.length-1)%it.length;sfx.blip()}if(take('down')||take('right')){S.menu=(S.menu+1)%it.length;sfx.blip()}
  if(take('a')){sfx.sel();const ch=it[S.menu]||it[0];if(ch==='Begin again'){ST=fresh();persist()}if(ch!=='Continue'&&ch!=='Begin'){}fadeThen(()=>enterRoom(ST.room,ST.room?'left':'start'))}}
function drawTitle(t){g.textAlign='center';g.font='12px '+MONO;g.fillStyle=yc(.5);g.fillText('A  DISCRETE  MATHEMATICS  STORY',320,150);
  g.font='64px '+SERIF;g.fillStyle=yc(1);g.fillText('The Sleeping',320,222);g.font='italic 64px '+SERIF;g.fillStyle=yc(.8);g.fillText('Proof',320,282);
  g.font='14px '+MONO;g.fillStyle=yc(.65);g.fillText('A mathematician stopped believing in her own mind.',320,326);g.fillText('You are the last thought still moving through it.',320,348);
  titleItems().forEach((s,k)=>{const y=398+k*30,sel=k===S.menu;g.font=(sel?'italic 24px ':'22px ')+SERIF;g.fillStyle=yc(sel?1:.5);g.fillText(s,320,y);if(sel){const w=g.measureText(s).width;drawSoul(320-w/2-20,y-7,t)}});
  g.font='11px '+MONO;g.fillStyle=yc(.35);g.fillText('Z or tap to choose · arrows to move',320,462);g.textAlign='left'}
function updEnding(){if(take('a')){S.endPage++;sfx.blip();if(S.endPage>ENDING.length+1){ST.done=true;persist();S.mode='title';S.menu=0}}}
function drawEnding(t){g.textAlign='center';if(S.endPage<ENDING.length){const lines=wrap(ENDING[S.endPage],'italic 26px '+SERIF,500);g.font='italic 26px '+SERIF;g.fillStyle=yc(1);lines.forEach((l,k)=>g.fillText(l,320,220+k*34-lines.length*17))}
  else if(S.endPage===ENDING.length){g.font='72px '+SERIF;g.fillStyle=yc(1);g.fillText('The End',320,220);g.font='italic 24px '+SERIF;g.fillStyle=yc(.75);g.fillText('Thank you for reasoning.',320,262)}
  else{const got=allCodex().flatMap(x=>x.items).filter(it=>ST.codex[it.key]).length,acc=ST.stats.asked?Math.round(100*ST.stats.right/ST.stats.asked):0;g.font='italic 30px '+SERIF;g.fillStyle=yc(1);g.fillText('What you carried',320,170);g.font='15px '+MONO;g.fillStyle=yc(.8);
    [`Guardians spared: 11 of 11`,`Questions reasoned through: ${ST.stats.asked}`,`Answered correctly: ${ST.stats.right} (${acc}%)`,`Codex entries found: ${got}`,'','Your Codex stays open: press C any time to review.'].forEach((l,k)=>g.fillText(l,320,220+k*28))}
  g.font='11px '+MONO;g.fillStyle=yc(.4);g.fillText('Z to continue',320,462);g.textAlign='left'}

/* main loop */
let last=performance.now();
function frame(now){const dt=Math.min(3,(now-last)/16.67);last=now;S.t=now;
  if(take('m'))setMute(!muted);
  if(S.fade>0){S.fade+=.06*dt;if(S.fade>=1&&S.fadeTo){const f=S.fadeTo;S.fadeTo=null;f();S.fade=-1}}
  else if(S.fade<0){S.fade+=.06*dt;if(S.fade>=0)S.fade=0}
  if(!codexEl.open&&S.fade===0){if(S.mode==='title')updTitle();else if(S.mode==='world')updWorld(dt);else if(S.mode==='battle')updBattle(dt);else if(S.mode==='ending')updEnding()}
  g.clearRect(0,0,CW,CH);g.fillStyle='rgba(10,10,9,.84)';g.fillRect(0,0,CW,CH);
  if(S.mode==='title')drawTitle(now);else if(S.mode==='world')drawWorld(now);else if(S.mode==='battle'){drawBattle(now)}else if(S.mode==='ending')drawEnding(now);
  if(toastT>0){toastT-=dt;g.font='12px '+MONO;const w=g.measureText(toastMsg).width+24;g.fillStyle='rgba(8,8,7,.92)';g.fillRect(CW-w-12,OY+10,w,26);g.strokeStyle=GOOD;g.strokeRect(CW-w-12+.5,OY+10.5,w-1,25);g.fillStyle=GOOD;g.fillText(toastMsg,CW-w,OY+27)}
  const fa=S.fade>0?S.fade:S.fade<0?-S.fade:0;if(fa>0){g.fillStyle=`rgba(8,8,7,${Math.min(1,fa)})`;g.fillRect(0,0,CW,CH)}
  for(const k in pressed)pressed[k]=false;
  requestAnimationFrame(frame)}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(frame));
window.__game={layoutQ,S,get B(){return B},get R(){return R},get DLG(){return DLG},ST:()=>ST,press,held,PL,codexEl,enterRoom,startBattle,nextQ:()=>nextQ()};

/* ---------- background: grain, brain, network ---------- */
(function(){
  // grain tile
  const g=document.createElement('canvas');g.width=g.height=220;const gx=g.getContext('2d'),id=gx.createImageData(220,220);
  for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.random()<.5?255:120}
  gx.putImageData(id,0,0);document.getElementById('grain').style.backgroundImage=`url(${g.toDataURL()})`;

  const cv=document.getElementById('bg'),ctx=cv.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1;const BONE='236,231,220';

  // brain point cloud: two folded hemispheres, cerebellum, brainstem
  const P=[];const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const fold=(x,y,z)=>{const wx=x+.12*Math.sin(7.1*z+2.3*y),wy=y+.12*Math.sin(6.3*x+1.7*z),wz=z+.12*Math.sin(5.7*y+2.9*x);return Math.sin(15.5*wx+3*Math.sin(9*wz+1.1))+Math.sin(14.2*wy+3*Math.sin(10.4*wx+.7))+Math.sin(13.6*wz+3*Math.sin(9.6*wy+2.3))};
  let tries=0;
  while(P.length<15000&&tries<900000){tries++;const s=Math.random()<.5?-1:1;let ux=gauss(),uy=gauss(),uz=gauss();const L=Math.hypot(ux,uy,uz);ux/=L;uy/=L;uz/=L;
    if(ux*s<-.32)continue;let x=ux*.31,y=uy*.5,z=uz*.72;if(y<0)y*=.62;x*=1-.12*(z/.72);
    if(uy<-.1&&uz>-.15&&uz<.55)x*=1.08;const X=s*.31+x;const f=fold(X,y,z);
    if(Math.abs(f)<.16)P.push([X,y,z,1]);else if(Math.random()<.02)P.push([X,y,z,.35])}
  let cb=0;tries=0;while(cb<1500&&tries<100000){tries++;const s=Math.random()<.5?-1:1;let ux=gauss(),uy=gauss(),uz=gauss();const L=Math.hypot(ux,uy,uz);ux/=L;uy/=L;uz/=L;
    const x=s*.16+ux*.19,y=-.37+uy*.14,z=-.5+uz*.19;if(Math.abs(Math.sin(44*y+3.5*Math.sin(6*x)))<.32){P.push([x,y,z,.85]);cb++}}
  for(let i=0;i<380;i++){const t=Math.random(),a=Math.random()*Math.PI*2,r=.085-.02*t;P.push([Math.cos(a)*r,-.28-.46*t,-.2-.1*t+Math.sin(a)*r,.6])}
  const glow=new Float32Array(P.length);const waves=[];

  // network
  let layers=[];const signals=[];
  function layout(){const spec=W<720*dpr?[3,5,6,5,3]:[4,7,9,9,7,4];layers=spec.map((n,li)=>{const x=W*(.07+.86*li/(spec.length-1));const span=Math.min(H*.66,n*Math.min(H*.09,74*dpr));
    return[...Array(n)].map((_,k)=>({x,y:H*.52+(n===1?0:span*(k/(n-1)-.5)),ph:Math.random()*6.28,fl:0}))})}
  function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=cv.width=Math.round(innerWidth*dpr);H=cv.height=Math.round(innerHeight*dpr);layout();if(reduce)draw(0)}
  addEventListener('resize',resize);

  function spawn(li,ni){if(li>=layers.length-1)return;const nx=layers[li+1];signals.push({li,a:ni,b:Math.floor(Math.random()*nx.length),t:0,sp:.006+Math.random()*.008})}
  window.bgFire=function(strength){const n=Math.round(4+strength*6);for(let i=0;i<n;i++)spawn(0,Math.floor(Math.random()*layers[0].length));
    const o=P[Math.floor(Math.random()*P.length)];waves.push({o,t0:performance.now(),amp:Math.min(1,.45+strength*.25)});if(strength>=2)waves.push({o:P[Math.floor(Math.random()*P.length)],t0:performance.now()+250,amp:.8});if(reduce)draw(performance.now())};

  const pos=(n,t)=>[n.x,n.y+Math.sin(t*.0006+n.ph)*5*dpr];
  let lastSpawn=0,lastWave=0;
  function draw(t){
    ctx.clearRect(0,0,W,H);
    // brain
    const S=Math.min(W,H)*.48,cx=W*.5,cy=H*.47,yaw=1.5708+.6*Math.sin(t*.00011),pitch=-.22,cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),breathe=1+Math.sin(t*.0009)*.012;
    const now=performance.now();
    for(let w=waves.length-1;w>=0;w--){if(now-waves[w].t0>2600)waves.splice(w,1)}
    const B=[[],[],[],[],[],[],[],[]];const sz=1.1*dpr;
    for(let i=0;i<P.length;i++){const[x,y,z,wt]=P[i];
      let gl=0;for(const wv of waves){const age=(now-wv.t0)/1000;if(age<0)continue;const d=Math.hypot(x-wv.o[0],y-wv.o[1],z-wv.o[2]);const rr=age*.75;const k=(d-rr)/.07;gl+=wv.amp*Math.exp(-k*k)*(1-age/2.6)}
      const x1=x*cyw+z*syw,z1=-x*syw+z*cyw,y2=y*cp-z1*sp,z2=y*sp+z1*cp;const pr=3.2/(3.2+z2);
      const depth=Math.max(0,Math.min(1,.5-z2*.6));let a=(.07+.3*depth)*wt+gl*.6;const b=Math.max(0,Math.min(7,Math.floor(a*14)));
      B[b].push(cx+x1*S*pr*breathe,cy-y2*S*pr*breathe,pr)}
    for(let b=0;b<8;b++){const arr=B[b];if(!arr.length)continue;ctx.fillStyle=`rgba(${BONE},${(b+.5)/14})`;ctx.beginPath();for(let i=0;i<arr.length;i+=3){const s=sz*arr[i+2];ctx.rect(arr[i]-s/2,arr[i+1]-s/2,s,s)}ctx.fill()}

    // network edges
    ctx.lineWidth=dpr*.8;ctx.strokeStyle=`rgba(${BONE},.05)`;ctx.beginPath();
    for(let li=0;li<layers.length-1;li++)for(const a of layers[li])for(const b of layers[li+1]){const p=pos(a,t),q=pos(b,t);ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1])}ctx.stroke();
    // signals
    if(!reduce&&t-lastSpawn>420){lastSpawn=t;spawn(0,Math.floor(Math.random()*layers[0].length))}
    if(!reduce&&t-lastWave>4200){lastWave=t;waves.push({o:P[Math.floor(Math.random()*P.length)],t0:now,amp:.35})}
    for(let i=signals.length-1;i>=0;i--){const s=signals[i];s.t+=reduce?1:s.sp*1.6;const A=layers[s.li][s.a],Bn=layers[s.li+1][s.b];if(!A||!Bn){signals.splice(i,1);continue}const p=pos(A,t),q=pos(Bn,t);
      if(s.t>=1){Bn.fl=1;signals.splice(i,1);if(Math.random()<.82)spawn(s.li+1,s.b);if(Math.random()<.25)spawn(s.li+1,s.b);continue}
      const x=p[0]+(q[0]-p[0])*s.t,y=p[1]+(q[1]-p[1])*s.t,tx=p[0]+(q[0]-p[0])*Math.max(0,s.t-.12),ty=p[1]+(q[1]-p[1])*Math.max(0,s.t-.12);
      const gr=ctx.createLinearGradient(tx,ty,x,y);gr.addColorStop(0,`rgba(${BONE},0)`);gr.addColorStop(1,`rgba(${BONE},.55)`);ctx.strokeStyle=gr;ctx.lineWidth=1.4*dpr;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(x,y);ctx.stroke();
      ctx.fillStyle=`rgba(${BONE},.8)`;ctx.beginPath();ctx.arc(x,y,1.7*dpr,0,6.283);ctx.fill()}
    if(signals.length>140)signals.splice(0,signals.length-140);
    // nodes
    for(const L of layers)for(const n of L){const[x,y]=pos(n,t);const r=(3.4+n.fl*2.2)*dpr;
      if(n.fl>.02){ctx.fillStyle=`rgba(${BONE},${n.fl*.12})`;ctx.beginPath();ctx.arc(x,y,r*3.2,0,6.283);ctx.fill()}
      ctx.fillStyle=`rgba(${BONE},${.06+n.fl*.5})`;ctx.strokeStyle=`rgba(${BONE},${.3+n.fl*.4})`;ctx.lineWidth=dpr;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.stroke();n.fl*=.94}
  }
  function loop(t){draw(t);requestAnimationFrame(loop)}
  resize();if(reduce)draw(0);else requestAnimationFrame(loop);
})();
</script>
